<!doctype html>
<meta charset="utf-8">
<title>jobfill tracker</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  #stats { color: #777; margin-bottom: 16px; }
  .filters button { margin-right: 6px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .filters button.active { background: #222; color: #fff; border-color: #222; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; color: #888; }
  select { padding: 3px; }
  input.notes { width: 100%; box-sizing: border-box; border: 1px solid transparent; padding: 3px; }
  input.notes:hover, input.notes:focus { border-color: #ccc; }
  .muted { color: #999; font-size: 12px; }
  .s-applied { color: #555; } .s-replied { color: #1565c0; } .s-interviewing { color: #e65100; }
  .s-offer { color: #2e7d32; font-weight: 600; } .s-rejected { color: #999; }
  .s-unsubmitted { color: #999; }
  .ghost-badge { display: inline-block; margin-top: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: rgba(211,47,47,.07); color: #d32f2f; white-space: nowrap; }
  a { color: #1565c0; text-decoration: none; }
  .summary-toggle { cursor: pointer; margin-top: 2px; }
  .jd-toggle { cursor: pointer; margin-top: 2px; }
  .jd-body { background: #f5f5f5; padding: 8px; max-height: 300px; overflow: auto; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  h2 { font-size: 16px; font-weight: 600; line-height: 1.2; margin-top: 32px; }
  .answer-block { background: #fff8dc; padding: 8px; overflow: hidden; }
  textarea.answer-edit { width: 100%; box-sizing: border-box; border: 1px solid transparent; padding: 8px; background: #fff8dc; }
  textarea.answer-edit:focus { border-color: #ccc; }
  .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .versions-toggle { color: #1565c0; cursor: pointer; }
  .pin-btn.pinned { color: #2e7d32; font-weight: 600; }
  .pin-btn { color: #999; cursor: pointer; }
  .delete-btn { color: #d32f2f; cursor: pointer; }
  .s-verify, .s-needs_manual, .s-error { color: #e65100; }
  .s-didnt_stick { color: #d32f2f; font-weight: 600; }
  .s-not_found, .s-stale { color: #999; }
  .s-partial { color: #e65100; }
  .s-frame_error { color: #e65100; }
  .failure-toggle { color: #1565c0; cursor: pointer; }
  .snapshot { background: #f5f5f5; padding: 8px; max-height: 160px; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.4; }
  .s-queued { color: #999; } .s-filling { color: #e65100; } .s-filled { color: #2e7d32; }
  .s-failed { color: #d32f2f; } .s-reviewed { color: #1565c0; } .s-submitted { color: #2e7d32; font-weight: 600; }
  .queue-toggle { color: #1565c0; cursor: pointer; }
  .queue-actions button { margin-right: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .d-queued { color: #2e7d32; }
  .d-rejected { color: #999; }
  .d-held { color: #e65100; }
  .seek-actions button { margin-right: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .decision-toggle { color: #1565c0; cursor: pointer; }
  .sweep-actions button { margin-right: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .s-running { color: #e65100; } .s-ok { color: #2e7d32; }
  .sweep-toggle { color: #1565c0; cursor: pointer; }
  .auth-badge { color: #d32f2f; font-weight: 600; margin: 4px 0; }
  .batch-actions button { margin-right: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .batch-toggle { color: #1565c0; cursor: pointer; }
  /* queue tracker overhaul: lifecycle chips + status pills + receded done-rows */
  .q-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
  .q-chip { padding: 3px 10px; cursor: pointer; border: 1px solid #ddd; background: #fff; border-radius: 999px; font-size: 12px; color: #555; }
  .q-chip:hover { border-color: #999; }
  .q-chip.active { background: #222; color: #fff; border-color: #222; }
  .q-chip .n { font-weight: 600; margin-left: 4px; }
  .q-pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .q-pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .q-pill.s-queued { background: #f5f5f5; color: #666; }
  .q-pill.s-filling { background: rgba(230,81,0,.08); color: #e65100; }
  .q-pill.s-filled { background: rgba(46,125,50,.08); color: #2e7d32; }
  .q-pill.s-reviewed { background: rgba(21,101,192,.08); color: #1565c0; }
  .q-pill.s-failed { background: rgba(211,47,47,.07); color: #d32f2f; }
  .q-pill.s-submitted { background: #f5f5f5; color: #666; }
  .q-pill.s-submitted::before { content: '✓'; width: auto; height: auto; border-radius: 0; background: none; }
  .q-row:hover td { background: #fafafa; }
  .q-row td { padding: 10px; }
  .q-done td { opacity: .55; }
  .q-done:hover td { opacity: .8; }
  .q-role a { color: #999; font-size: 12px; }
  .q-date { white-space: nowrap; }
  td.queue-actions { white-space: nowrap; }
  /* tab navigation: sticky header, underline tabs (distinct from filter chips) */
  .tabbar { position: sticky; top: 0; background: #fff; z-index: 10; display: flex; gap: 2px; border-bottom: 1px solid #eee; margin: 12px 0 4px; }
  .tabbar button { border: none; background: none; cursor: pointer; padding: 8px 14px; font-size: 14px; color: #777; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabbar button:hover { color: #222; }
  .tabbar button.active { color: #222; font-weight: 600; border-bottom-color: #222; }
  .tabbar .tab-badge { display: inline-block; min-width: 16px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: rgba(21,101,192,.1); color: #1565c0; font-size: 11px; font-weight: 600; }
  .tabbar .tab-badge:empty { display: none; }
  [data-tab] { display: none; }
  [data-tab].tab-visible { display: block; }
  [data-tab].tab-visible h2:first-child { margin-top: 16px; }
  .queue-actions button.primary { border-color: #1565c0; color: #1565c0; font-weight: 600; }
  .queue-actions button.primary:hover { background: #1565c0; color: #fff; }
  .queue-actions button.q-remove { color: #d32f2f; border-color: #eee; }
  .queue-actions button.q-remove:hover { border-color: #d32f2f; }
  /* armed = second click commits; color signals state, width is pinned in JS */
  .queue-actions button.armed { background: #1565c0; color: #fff; border-color: #1565c0; font-weight: 600; }
  .queue-actions button.q-remove.armed { background: #d32f2f; border-color: #d32f2f; }
  .q-empty { padding: 16px 0; }

  /* Settings tab (D-08, CFG-01). .settings-actions button is a byte-for-byte
     copy of the existing .queue-actions button rule, matching this file's
     repeated-per-section convention rather than introducing a shared class.
     .settings-actions button.armed is deliberately red (#d32f2f) where
     .queue-actions button.armed is blue, because here the armed state guards
     a narrowing filter change (destructive: a permanently rejected posting). */
  .settings-section { margin-bottom: 32px; }
  .settings-subhead { font-size: 14px; font-weight: 600; margin: 20px 0 8px; color: #555; }
  .settings-field { margin-bottom: 16px; }
  .settings-field label { display: block; font-weight: 600; margin-bottom: 4px; }
  .settings-field textarea, .settings-field input[type=text], .settings-field input[type=email],
  .settings-field input[type=tel], .settings-field input[type=url], .settings-field input[type=number] {
    width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px;
    font: 14px/1.5 system-ui, sans-serif;
  }
  .settings-field textarea { min-height: 100px; }
  .settings-field.profile textarea { min-height: 180px; }
  .settings-hint { font-size: 12px; color: #999; margin-top: 4px; }
  .settings-hint.rule-error { color: #d32f2f; }
  .settings-count { font-size: 12px; color: #999; }
  .settings-summary { background: #f5f5f5; padding: 10px 12px; border-radius: 4px; font-size: 12px; color: #555; margin: 12px 0; }
  .settings-checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .settings-actions button { margin-right: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .settings-actions button.primary { border-color: #1565c0; color: #1565c0; font-weight: 600; }
  .settings-actions button.primary:hover { background: #1565c0; color: #fff; }
  .settings-actions button.armed { background: #d32f2f; color: #fff; border-color: #d32f2f; font-weight: 600; }
</style>
<body>
  <h1>jobfill tracker</h1>
  <nav class="tabbar" id="tabbar">
    <button onclick="setTab('queue')" data-tabbtn="queue">queue<span class="tab-badge" id="tab-badge-queue"></span></button>
    <button onclick="setTab('runs')" data-tabbtn="runs">runs</button>
    <button onclick="setTab('applications')" data-tabbtn="applications">applications</button>
    <button onclick="setTab('library')" data-tabbtn="library">library</button>
    <button onclick="setTab('failures')" data-tabbtn="failures">failures</button>
    <button onclick="setTab('settings')" data-tabbtn="settings">settings</button>
  </nav>
  <div id="queue" data-tab="queue">
    <h2>posting queue</h2>
    <div id="queueSummary"></div>
    <div id="queueBody"></div>
  </div>
  <div id="sweeps" data-tab="runs">
    <h2>sweeps</h2>
    <div class="sweep-actions"><button onclick="triggerSweep()">Trigger sweep now</button></div>
    <div id="sweepsBadges"></div>
    <div id="sweepsBody"></div>
  </div>
  <div id="batch" data-tab="runs">
    <h2>batch fills</h2>
    <div class="batch-actions"><button onclick="triggerBatch()">Trigger batch now</button></div>
    <div id="batchBody"></div>
  </div>
  <div id="seek" data-tab="runs">
    <h2>seek decisions</h2>
    <div id="seekStats"></div>
    <div class="filters" id="seekFilters"></div>
    <div id="seekBody"></div>
  </div>
  <div id="applications" data-tab="applications">
    <h2>applications</h2>
    <div id="stats"></div>
    <div class="filters" id="filters"></div>
    <table>
      <thead><tr><th>date</th><th>company</th><th>role</th><th>status</th><th>notes</th><th>links</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="library" data-tab="library">
    <h2>answer library</h2>
    <div id="libraryBody"></div>
  </div>
  <div id="failures" data-tab="failures">
    <h2>widget failures</h2>
    <div id="failuresBody"></div>
  </div>
  <div id="settings" data-tab="settings">
    <h2>search criteria</h2>
    <div id="settingsCriteriaBody"></div>
  </div>
<script>
const STATUSES = ['unsubmitted', 'applied', 'replied', 'interviewing', 'offer', 'rejected'];
// D-05: pre-submit token stays the raw enum in the store/PATCH; only its display
// string is mapped here. Mirrors QUEUE_CHIPS' key→label indirection — never store
// a display string. Unknown tokens fall through label() to their raw id.
const STATUS_LABELS = { unsubmitted: 'awaiting submit' };
const label = s => STATUS_LABELS[s] || s;
let apps = [];
let filter = 'all';

async function load() {
  apps = await (await fetch('/applications')).json();
  render();
}

function render() {
  // D-15: 'ghosted' is a synthetic chip filtering the server-derived a.ghosted flag,
  // not a status equality match — trust the server field, never recompute the rule here.
  const shown = filter === 'all' ? apps
    : filter === 'ghosted' ? apps.filter(a => a.ghosted)
    : apps.filter(a => a.status === filter);
  const spend = apps.reduce((s, a) => s + (a.cost_usd || 0), 0);
  // D-09: a filled-but-unsubmitted row is work-in-progress, not in flight — exclude it
  // (alongside 'rejected') from the headline active count.
  const active = apps.filter(a => !['rejected', 'unsubmitted'].includes(a.status)).length;
  document.getElementById('stats').textContent =
    `${apps.length} applications · ${active} active · $${spend.toFixed(2)} api spend`;

  // Synthetic 'ghosted' chip mixed with the status keys (mirrors QUEUE_CHIPS' 'all').
  document.getElementById('filters').innerHTML = ['all', ...STATUSES, 'ghosted']
    .map(s => {
      const count = s === 'all' ? null
        : s === 'ghosted' ? apps.filter(a => a.ghosted).length
        : apps.filter(a => a.status === s).length;
      return `<button class="${filter === s ? 'active' : ''}" onclick="filter='${s}';render()">${label(s)}${count === null ? '' : ` (${count})`}</button>`;
    })
    .join('');

  document.getElementById('rows').innerHTML = shown.map(a => `
    <tr>
      <td class="muted">${(a.created_at || '').slice(0, 10)}</td>
      <td><strong>${esc(a.company)}</strong></td>
      <td>${esc(a.role)}</td>
      <td><select class="s-${a.status}" onchange="patch(${a.id}, {status: this.value})">
        ${STATUSES.map(s => `<option value="${s}" ${s === a.status ? 'selected' : ''}>${label(s)}</option>`).join('')}
      </select>
      ${a.ghosted ? `<div class="ghost-badge">ghosted · ${Number(a.days_silent)}d</div>` : ''}
      </td>
      <td><input class="notes" value="${esc(a.notes)}" placeholder="notes…"
        onchange="patch(${a.id}, {notes: this.value})"></td>
      <td>
        ${a.url ? `<a href="${esc(a.url)}" target="_blank">posting</a>` : ''}
        ${a.resume_path ? `<div class="muted" title="${esc(a.resume_path)}">resume: …/${esc(a.resume_path.split('/').slice(-2).join('/'))}</div>` : ''}
        ${tailorStateLine(a.tailor_state, a.tailor_message)}
        ${a.summary ? `
          <div class="muted summary-toggle" onclick="toggleSummary(${a.id})">resume changes <span id="arrow-${a.id}">▾</span></div>
          <div class="summary-body" id="summary-${a.id}" style="display:none">
            ${a.summary.map(line => `<div class="muted" style="padding-left:4px">${esc(line)}</div>`).join('')}
          </div>
        ` : ''}
        <div class="muted jd-toggle" onclick="toggleJd(${a.id})">job description <span id="jd-arrow-${a.id}">▾</span></div>
        <div class="jd-slot" id="jd-slot-${a.id}" style="display:none"></div>
        <div class="gen-menu">
          <select id="gen-select-${a.id}" onchange="if(this.value) triggerGenerate(${a.id}, this.value)">
            <option value="">generate ▾</option>
            <option value="cover-letter" ${a.tailor_state !== 'ran' ? 'disabled' : ''}>cover letter</option>
            <option value="email">follow-up email</option>
            <option value="brief">interview-prep brief</option>
          </select>
        </div>
        <div class="muted" id="gen-status-${a.id}"></div>
        ${a.cover_letter_path ? `<div class="muted">cover letter: <a href="/applications/${a.id}/doc/cover-letter" target="_blank">open PDF</a></div>` : ''}
        ${a.brief_path ? `<div class="muted">interview-prep brief: <a href="/applications/${a.id}/doc/brief" target="_blank">open PDF</a></div>` : ''}
        ${a.email_path ? `
          <div class="muted jd-toggle" onclick="toggleEmail(${a.id})">follow-up email <span id="email-arrow-${a.id}">▾</span></div>
          <div class="jd-slot" id="email-slot-${a.id}" style="display:none"></div>
        ` : ''}
      </td>
    </tr>`).join('');
}

// D-05: the generate menu blocks on the request — the control is disabled and
// shows "generating…" before the fetch, reset in a finally so the row is never
// left stuck disabled on a thrown/rejected fetch. No existing dashboard.html
// button blocks for a true multi-minute server op (triggerFill fires-and-forgets
// a detached runner job); this is new UI, not a copy.
async function triggerGenerate(id, doctype) {
  const select = document.getElementById(`gen-select-${id}`);
  const status = document.getElementById(`gen-status-${id}`);
  const placeholder = select.options[0];
  const placeholderLabel = placeholder.textContent;
  placeholder.textContent = 'generating…';
  select.value = '';
  select.disabled = true;
  status.textContent = '';
  try {
    const resp = await fetch(`/applications/${id}/generate/${doctype}`, { method: 'POST' });
    const body = await resp.json();
    if (!resp.ok) {
      status.textContent = esc(body.error || `HTTP ${resp.status}`);
    } else if (doctype === 'email') {
      // CR-02: the read-back box's cache is keyed by id and never invalidated on
      // its own — a successful regeneration must drop the stale cached draft (and
      // collapse an already-open box) so the next toggleEmail() open re-fetches
      // the fresh text instead of showing the previous generation.
      emailCache.delete(id);
      const slot = document.getElementById(`email-slot-${id}`);
      const arrow = document.getElementById(`email-arrow-${id}`);
      if (slot && slot.style.display !== 'none') {
        slot.style.display = 'none';
        if (arrow) arrow.textContent = '▾';
      }
    }
  } catch (e) {
    status.textContent = `helper unreachable — ${esc(String(e?.message || e))}`;
  } finally {
    placeholder.textContent = placeholderLabel;
    select.disabled = false;
  }
  await load();
}

async function patch(id, body) {
  await fetch(`/applications/${id}`, {
    method: 'PATCH',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  load();
}

function toggleSummary(id) {
  const body = document.getElementById(`summary-${id}`);
  const arrow = document.getElementById(`arrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';
}

// D-07: jd is kept out of the list payload, so it's fetched on demand here,
// once per row, and cached — re-collapsing/re-expanding a cached row does not
// re-hit the endpoint. Only the error state re-attempts on re-expand (T-14-06).
const jdCache = new Map();

async function toggleJd(id) {
  const slot = document.getElementById(`jd-slot-${id}`);
  const arrow = document.getElementById(`jd-arrow-${id}`);
  const expanded = slot.style.display !== 'none';
  if (expanded) {
    slot.style.display = 'none';
    arrow.textContent = '▾';
    return;
  }
  slot.style.display = 'block';
  arrow.textContent = '▴';

  if (jdCache.has(id)) {
    slot.innerHTML = jdCache.get(id);
    return;
  }

  slot.innerHTML = `<div class="muted">loading job description…</div>`;
  try {
    const resp = await fetch(`/applications/${id}/jd`);
    if (!resp.ok) {
      slot.innerHTML = `<div class="muted">couldn't load job description — click to retry</div>`;
      return;
    }
    const { jd } = await resp.json();
    const html = jd && jd.trim()
      ? `<div class="jd-body">${esc(jd)}</div>`
      : `<div class="muted">no JD captured</div>`;
    jdCache.set(id, html);
    slot.innerHTML = html;
  } catch (e) {
    slot.innerHTML = `<div class="muted">couldn't load job description — click to retry</div>`;
  }
}

// D-07: the generated follow-up email surfaces in an inline expandable
// read-back box, reusing toggleJd's structure verbatim — cache success/empty,
// never cache the error branch so re-expand re-attempts (mirrors T-14-06).
// The fetched email text is inserted via esc() before innerHTML — mitigates
// stored-XSS from generated prose (T-15-06, mirrors T-14-05).
const emailCache = new Map();

async function toggleEmail(id) {
  const slot = document.getElementById(`email-slot-${id}`);
  const arrow = document.getElementById(`email-arrow-${id}`);
  const expanded = slot.style.display !== 'none';
  if (expanded) {
    slot.style.display = 'none';
    arrow.textContent = '▾';
    return;
  }
  slot.style.display = 'block';
  arrow.textContent = '▴';

  if (emailCache.has(id)) {
    slot.innerHTML = emailCache.get(id);
    return;
  }

  slot.innerHTML = `<div class="muted">loading follow-up email…</div>`;
  try {
    const resp = await fetch(`/applications/${id}/email`);
    if (!resp.ok) {
      slot.innerHTML = `<div class="muted">couldn't load follow-up email — click to retry</div>`;
      return;
    }
    const { email } = await resp.json();
    const html = email && email.trim()
      ? `<div class="jd-body">${esc(email)}</div>`
      : `<div class="muted">no email generated</div>`;
    emailCache.set(id, html);
    slot.innerHTML = html;
  } catch (e) {
    slot.innerHTML = `<div class="muted">couldn't load follow-up email — click to retry</div>`;
  }
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// OBS-01: always-visible tailor-state line — unlike the resume-changes toggle above
// (gated on a.summary truthiness), this renders for every fill regardless of summary.
function tailorStateLine(tailorState, tailorMessage) {
  if (tailorState === 'ran') return `<div class="muted">tailored resume attached</div>`;
  if (tailorState === 'skipped') return `<div class="muted">static resume — ${esc(tailorMessage)}</div>`;
  if (tailorState === 'error') return `<div style="color:#e65100">tailor failed — ${esc(tailorMessage)} · static resume used</div>`;
  return '';
}

async function loadLibrary() {
  const groups = await (await fetch('/answers')).json();
  renderLibrary(groups);
}

function renderVersionRow(v) {
  return `
    <div style="padding-left: 4px; margin-top: 6px;">
      <div class="muted clamp-3">${esc(v.answer)}</div>
      <div class="muted">${(v.created_at || '').slice(0, 10)}
        <span class="pin-btn ${v.pinned ? 'pinned' : ''}" onclick="patchAnswer(${v.id}, {pinned: ${v.pinned ? 0 : 1}})">${v.pinned ? 'pinned' : 'pin'}</span>
        · <span class="delete-btn" onclick="deleteAnswer(${v.id})">delete</span>
      </div>
    </div>`;
}

function renderLibrary(groups) {
  const body = document.getElementById('libraryBody');
  if (!groups.length) {
    body.innerHTML = `
      <div class="muted">no answers banked yet</div>
      <div class="muted" style="font-size: 12px">capture answers from the popup after filling a form with essay questions.</div>`;
    return;

const QUEUE_STATUSES = ['queued', 'filling', 'filled', 'failed', 'reviewed', 'submitted'];
// Resolved in the Task 3 checkpoint: replace with the real unpacked extension id

const EXTENSION_ID = 'ppjcjpmmaenfcjaoedhggdmpomkdcaha';

// Fill via the helper-spawned Playwright runner (POST /fill/:id) — works from
// any browser, no extension/API key needed where the dashboard is open. The
// runner browser carries its own extension + key; the row's status is the
// result channel. Login-gated rows are rejected server-side with a pointer at
// the popup path (your signed-in browser has the sessions, the runner doesn't).
async function triggerFill(id) {
  const q = queueRows.find(r => r.id === id);
  if (!q) return;
  let notice = '';
  try {
    const resp = await fetch(`/fill/${id}`, { method: 'POST' });
    const body = await resp.json();
    notice = resp.ok ? `fill started — ${esc(body.note || 'watch the row status')}` : esc(body.error || `HTTP ${resp.status}`);
  } catch (e) {
    notice = `helper unreachable — ${esc(String(e?.message || e))}`;
  }
  // reload first: renderQueue replaces queueBody's innerHTML and would wipe the notice
  await loadQueue();
  if (notice) {
    document.getElementById('queueBody').insertAdjacentHTML('afterbegin', `<div class="muted">${notice}</div>`);
  }
}

// Two-click arm/confirm for destructive actions (native confirm() dialogs die in
// the runner's Playwright browser — auto-dismissed when no handler is registered).
// Zero layout shift: the armed label is always SHORTER than the resting label and
// the button's width is pinned before the text swap, so nothing on the row moves.
// The armed state signals with color (CSS .armed), not length. 4s revert.
const armState = new Map();
function armOrConfirm(key, btnId, armedText, restingText) {
  if (armState.has(key)) {
    clearTimeout(armState.get(key));
    armState.delete(key);
    return true;
  }
  const btn = document.getElementById(btnId);
  if (btn) {
    btn.style.minWidth = `${btn.offsetWidth}px`;
    btn.textContent = armedText;
    btn.classList.add('armed');
  }
  armState.set(key, setTimeout(() => {
    armState.delete(key);
    const b = document.getElementById(btnId);
    if (b) {
      b.textContent = restingText;
      b.classList.remove('armed');
      b.style.minWidth = '';
    }
  }, 4000));
  return false;
}

// D-02: the ONLY code path in the whole system that constructs a 'submitted' status —
// no background/helper code sets it. Gated behind the deliberate two-click arm.
function markSubmitted(id) {
  const q = queueRows.find(r => r.id === id);
  if (!q) return;
  if (!armOrConfirm(`submit-${id}`, `submit-btn-${id}`, 'confirm?', 'mark submitted')) return;
  patchQueue(id, { status: 'submitted' });
}

// Hard delete for rows the operator won't pursue — same arm pattern.
async function removeFromQueue(id) {
  if (!armOrConfirm(`remove-${id}`, `remove-btn-${id}`, 'sure?', 'remove')) return;

  if (!res.ok) {

    document.getElementById('queueBody').insertAdjacentHTML('afterbegin', `<div class="muted">remove failed — ${esc(body.error || `HTTP ${res.status}`)}</div>`);

}

async function patchQueue(id, body) {
  const res = await fetch(`/queue/${id}`, {
    method: 'PATCH',
    headers: { 'content-type': 'application/json' },

  await loadQueue();

// Lifecycle chip bar — the D-03 reviewed/filled split, upgraded into the tracker's
// filter control. Chips sit in pipeline order with live counts; the active chip
// filters the table. Labels speak the operator's language ("needs review", "ready to
// submit"), not raw status enums.
let queueFilter = 'all';
const QUEUE_CHIPS = [
  { key: 'all', label: 'all' },
  { key: 'reviewed', label: 'ready to submit' },
  { key: 'filled', label: 'needs review' },
  { key: 'filling', label: 'filling' },
  { key: 'queued', label: 'queued' },
  { key: 'failed', label: 'failed' },
  { key: 'submitted', label: 'submitted' },
];
function setQueueFilter(key) {
  queueFilter = key;
  renderQueue(queueRows);
}
function renderQueueChips(rows) {
  const el = document.getElementById('queueSummary');
  const counts = {};
  for (const r of rows) counts[r.status] = (counts[r.status] || 0) + 1;
  // Queue tab badge = the actionable morning number (ready to submit + needs review)
  const actionable = (counts.reviewed || 0) + (counts.filled || 0);
  document.getElementById('tab-badge-queue').textContent = actionable || '';
  el.innerHTML = `<div class="q-chips">${QUEUE_CHIPS

}

// Actionability sort: what the operator should touch first floats to the top; submitted is
// history and sinks to the bottom, visually receded (.q-done).
const QUEUE_ORDER = { reviewed: 0, filled: 1, filling: 2, queued: 3, failed: 4, submitted: 5 };
function renderQueue(rows) {
  renderQueueChips(rows);
  const body = document.getElementById('queueBody');
  if (!rows.length) {
    body.innerHTML = `

    return;
  }
  const shown = (queueFilter === 'all' ? rows : rows.filter(r => r.status === queueFilter))
    .slice()
    .sort((a, b) => (QUEUE_ORDER[a.status] ?? 9) - (QUEUE_ORDER[b.status] ?? 9)
      || String(b.created_at || '').localeCompare(String(a.created_at || '')));
  if (!shown.length) {
    body.innerHTML = `<div class="muted q-empty">nothing here — pick another filter above.</div>`;
    return;
  }
  // D-09: skip badges — cross-reference the LATEST FINISHED batch run's skip list
  // (mirrors renderAuthBadges' rows.find(r => r.status !== 'running' && r.detail)).
  // A row skipped two runs ago and absent from the latest run shows no badge.
  const latestBatch = batchRows.find(r => r.status !== 'running' && r.detail);
  const skippedThisBatch = new Map((latestBatch?.detail?.skipped || []).map(s => [s.queueId, s.reason]));
  body.innerHTML = `
    <table>
      <thead><tr><th>status</th><th>company / role</th><th>added</th><th>results</th><th>actions</th></tr></thead>
      <tbody>
        ${shown.map(q => {
          const statusClass = QUEUE_STATUSES.includes(q.status) ? `s-${q.status}` : 'muted';
          // results_summary is a JSON STRING written by background.js (JSON.stringify of the
          // per-field results array) — never a display string. Guard the parse; on failure or
          // empty input, render nothing rather than injecting the raw string into the DOM.
          let results;
          try {
            results = JSON.parse(q.results_summary || '{}');
          } catch {
            results = null;
          }
          const resultsHtml = renderQueueResults(results);
          // WR-01-style guard (mirrors the failures table): stored urls are untrusted —
          // esc() does not neutralize a javascript: scheme, so only emit an anchor for http(s).
          const safeUrl = /^https?:\/\//i.test(q.url) ? q.url : '';
          const skipReason = q.status === 'queued' ? skippedThisBatch.get(q.id) : undefined;
          const done = q.status === 'submitted';
          // Contextual actions: only what makes sense for the row's lifecycle stage.
          // 'mark submitted' stays available pre-submit (manual-apply path); submitted
          // rows are history and get no buttons.
          const actions = done ? '' : [
            (q.status === 'queued' || q.status === 'failed') ? `<button onclick="triggerFill(${q.id})">Fill now</button>` : '',
            q.status === 'filling' ? `<button disabled>Fill now</button>` : '',
            q.status === 'filled' ? `<button onclick="patchQueue(${q.id}, {status: 'reviewed'})">mark reviewed</button>` : '',
            `<button id="submit-btn-${q.id}" ${q.status === 'reviewed' ? 'class="primary" ' : ''}onclick="markSubmitted(${q.id})">mark submitted</button>`,
            q.status !== 'filling' ? `<button id="remove-btn-${q.id}" class="q-remove" onclick="removeFromQueue(${q.id})">remove</button>` : '',
          ].join('');
          return `
            <tr class="q-row${done ? ' q-done' : ''}">
              <td><span class="q-pill ${statusClass}">${esc(q.status)}</span></td>
              <td class="q-role"><strong>${esc(q.company)}</strong>${q.role ? ` · ${esc(q.role)}` : ''}
                <div style="text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 380px">
                  ${safeUrl ? `<a href="${esc(safeUrl)}" target="_blank">${esc(safeUrl)}</a>` : `<span class="muted">${esc(q.url)}</span>`}
                </div>
                ${q.resume_name ? `<div class="muted">resume: <a href="/queue/${q.id}/resume" target="_blank">${esc(q.resume_name)}</a></div>` : ''}
                ${q.status === 'failed' ? `<div class="muted">fill failed — ${esc(q.error)}. check the field results, or retry.</div>` : ''}
                ${skipReason ? `<div class="muted">skipped last batch — ${esc((SKIP_REASON_LABELS[skipReason] || skipReason).replace(/^skipped — /, ''))}</div>` : ''}</td>
              <td class="muted q-date">${(q.created_at || '').slice(0, 10)}</td>
              <td>
                <div class="muted queue-toggle" onclick="toggleQueueResults(${q.id})">results <span id="qarrow-${q.id}">▾</span></div>
                <div id="qresults-${q.id}" style="display:none">${resultsHtml}</div>
              </td>

}

// results is either a parsed per-field results object/array (JSON.parse succeeded) or
// null (parse failed / empty) — never render the raw unparsed string.
// Statuses are allowlisted at render — results_summary is untrusted, server-stored JSON
// influenced by the LLM mapping call, so an unknown status must never reach the class
// attribute (stored-XSS sink), mirroring FAILURE_STATUSES above.
const QUEUE_REVIEW_STATUSES = new Set(['verify', 'needs_manual', 'error', 'partial', 'not_found', 'stale', 'frame_error']);
function renderQueueResults(results) {
  if (!results) return `<div class="muted" style="padding-left:4px">no summary</div>`;
  const items = Array.isArray(results) ? results : Object.entries(results).map(([k, v]) => ({ label: k, ...(typeof v === 'object' && v ? v : { value: v }) }));
  if (!items.length) return `<div class="muted" style="padding-left:4px">no summary</div>`;
  return items.map(r => {
    const cls = QUEUE_REVIEW_STATUSES.has(r.status) ? `s-${r.status}` : 'muted';
    const stuckNote = r.stuck === false ? ` <span class="s-didnt_stick">didn't stick — check this field</span>` : '';
    return `<div class="${cls}" style="padding-left:4px">${esc(r.label || r.id || '')}: ${esc(r.status || r.value || '')}${stuckNote}</div>`;
  }).join('');
}

function toggleQueueResults(id) {
  const body = document.getElementById(`qresults-${id}`);
  const arrow = document.getElementById(`qarrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';

// D-15/FILT-04: seek decisions section. Two independent scopes on one screen —
// #seekStats is the persisted LAST SWEEP summary (from GET /seek/last, server-
// authored counts, never derived from #seekBody's rows), while #seekFilters'
// counts and #seekBody's table are the CURRENT, browsable state across all
// /postings rows. Mirrors QUEUE_STATUSES: decision is untrusted stored state,
// so it's allowlisted before it reaches a class attribute (stored-XSS sink).
const DECISION_VALUES = new Set(['queued', 'rejected', 'held']);
let lastSweep = null;
let postingsRows = [];
let seekFilter = 'all';
let seekBreakdownExpanded = false;

async function loadPostings() {
  [lastSweep, postingsRows] = await Promise.all([
    fetch('/seek/last').then(r => r.json()),
    fetch('/postings').then(r => r.json()),
  ]);
  renderSeekStats(lastSweep);
  renderSeekFilters(postingsRows);
  renderPostings(postingsRows);
}

// Translates a stored decision_reason code into the operator-facing copy — never render
// a raw code (UI-SPEC Reason Label Map). The llm: branches carry an untrusted
// LLM-derived one-liner about third-party JD content, so it's esc()-escaped here.
function reasonLabel(code) {
  if (!code) return '—';
  if (code === 'rules:location') return 'rejected — not NY/SF-based or remote-friendly';
  if (code === 'rules:title') return 'rejected — title outside target roles';
  if (code === 'rules:yoe') return 'rejected — requires more experience than target (incl. seniority-marker titles)';
  if (code === 'rules:stale') return 'rejected — posted more than 2 days ago';
  if (code === 'rules:board-grace') return 'rejected — new board, first poll skipped to avoid queueing its backlog';
  if (code.startsWith('llm:not-relevant')) {
    return `not relevant — ${esc(code.replace(/^llm:not-relevant\s*—\s*/, ''))}`;
  }
  if (code.startsWith('llm:relevant')) {
    return `relevant — ${esc(code.replace(/^llm:relevant\s*—\s*/, ''))}`;
  }
  if (code === 'queued: manual') return 'queued manually by the operator';
  if (code === 'held:jd-fetch-error') return 'held: could not fetch job description — will retry next sweep';
  if (code === 'held:llm-error') return 'held: LLM check failed — will retry next sweep';
  if (code.startsWith('dedupe:')) return 'duplicate — already queued or applied';
  if (code.startsWith('rules:')) return 'rejected — did not match target criteria';
  return esc(code);
}

function toggleSeekBreakdown() {
  seekBreakdownExpanded = !seekBreakdownExpanded;
  renderSeekStats(lastSweep);
}

// lastSweep's numeric counts (fetched/rejected/held/queued/byCriterion/deduped)
// are server-authored — rendered as numbers, never as raw HTML (T-10-11).
function renderSeekStats(ls) {
  const el = document.getElementById('seekStats');
  if (!ls) {
    el.innerHTML = `<div class="muted">no seek sweep run yet</div>`;
    return;
  }
  const summary = `${ls.fetched} fetched · ${ls.rejected} rejected · ${ls.held} held · ${ls.queued} queued`;
  if (!ls.rejected) {
    el.innerHTML = `<div>${summary}</div>`;
    return;
  }
  const bc = ls.byCriterion || {};
  const toggleTitle = seekBreakdownExpanded ? 'hide rejection breakdown' : 'show rejection breakdown';
  const breakdown = seekBreakdownExpanded
    ? ` (location ${bc.location ?? 0} · title ${bc.title ?? 0} · yoe ${bc.yoe ?? 0} · stale ${bc.stale ?? 0} · grace ${bc.grace ?? 0} · llm ${bc.llm ?? 0} · duplicate ${ls.deduped ?? 0})`
    : '';
  el.innerHTML = `<div>${summary}
    <span class="decision-toggle" title="${toggleTitle}" onclick="toggleSeekBreakdown()">${seekBreakdownExpanded ? '▴' : '▾'}</span><span class="muted">${breakdown}</span>
  </div>`;
}

function renderSeekFilters(rows) {
  const counts = {
    all: rows.length,
    queued: rows.filter(r => r.decision === 'queued').length,
    rejected: rows.filter(r => r.decision === 'rejected').length,
    held: rows.filter(r => r.decision === 'held').length,
    unscored: rows.filter(r => r.decision == null).length,
  };
  document.getElementById('seekFilters').innerHTML = ['all', 'queued', 'rejected', 'held', 'unscored']
    .map(s => `<button class="${seekFilter === s ? 'active' : ''}" onclick="seekFilter='${s}';renderPostings(postingsRows)">${s} (${counts[s]})</button>`)
    .join('');
}

function renderPostings(rows) {
  const body = document.getElementById('seekBody');
  if (!rows.length) {
    body.innerHTML = `
      <div class="muted">no postings decided yet</div>
      <div class="muted" style="font-size: 12px">run a seek sweep (\`bun run seek\`) to discover and filter postings.</div>`;
    return;
  }
  const shown = seekFilter === 'all' ? rows
    : seekFilter === 'unscored' ? rows.filter(r => r.decision == null)
    : rows.filter(r => r.decision === seekFilter);
  if (!shown.length) {
    body.innerHTML = `<div class="muted">no postings match this filter</div>`;
    return;
  }
  body.innerHTML = `
    <table>
      <thead><tr><th>date</th><th>company / role</th><th>source</th><th>decision</th><th>reason</th><th>action</th></tr></thead>
      <tbody>
        ${shown.map(p => {
          const decisionClass = DECISION_VALUES.has(p.decision) ? `d-${p.decision}` : 'muted';
          const decisionLabel = p.decision ? esc(p.decision) : '—';
          return `
            <tr>
              <td class="muted">${(p.fetched_at || '').slice(0, 10)}</td>
              <td><strong>${esc(p.company)}</strong> · ${esc(p.title)}</td>
              <td>${esc(p.source)}</td>
              <td><span class="${decisionClass}">${decisionLabel}</span></td>
              <td class="muted">${reasonLabel(p.decision_reason)}</td>
              <td class="seek-actions">
                ${p.decision === 'rejected' || p.decision === 'held' ? `<button onclick="queueReject(${p.id})">queue anyway</button>` : ''}
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// Additive/promotive override (D-16) — no confirm() dialog, matching the
// non-destructive "mark reviewed" button. Reloads first so the two re-renders
// don't wipe an inserted notice (mirrors triggerFill's reload-then-notify order).
async function queueReject(id) {
  const resp = await (await fetch(`/postings/${id}/promote`, { method: 'POST' })).json();
  await loadPostings();
  await loadQueue();
  if (resp && resp.promoted === false) {
    document.getElementById('seekBody').insertAdjacentHTML('afterbegin', `<div class="muted">already queued or applied</div>`);
  }
}

// D-14/D-16: sweeps run-history — last-N-runs list with per-source
// expandable detail, in-progress polling, a manual trigger button on the
// identical POST /sweep path the CLI and scheduler tick use, and an
// auth-expired badge. Status is untrusted server-authored state, allowlisted
// before it reaches a class attribute (stored-XSS sink), mirroring
// FAILURE_STATUSES/QUEUE_STATUSES/DECISION_VALUES above.
const SWEEP_STATUSES = new Set(['running', 'ok', 'failed']);
let sweepRows = [];
let sweepPollHandle = null;

async function loadSweeps() {
  sweepRows = await (await fetch('/sweeps')).json();
  renderSweeps(sweepRows);
}

// Fire-and-poll (D-10): mirrors triggerFill's reload-first-then-notify
// order. A 409 (already running) is a friendly notice, not a thrown error.
async function triggerSweep() {
  const resp = await fetch('/sweep', { method: 'POST' });
  const body = await resp.json();
  await loadSweeps();
  if (resp.status === 409) {
    document.getElementById('sweepsBody').insertAdjacentHTML('afterbegin', `<div class="muted">sweep already running (run ${Number(body.runId) || ''})</div>`);
    return;
  }
  if (resp.ok && body.id) pollSweep(body.id);
}

// Polling primitive (11-RESEARCH Code Examples) — re-renders the in-progress
// run at the top of the list every ~3s, stops once status leaves 'running'.
// A single active poll handle is guarded so a second trigger during an
// existing poll doesn't stack intervals.
function pollSweep(runId) {
  if (sweepPollHandle) clearInterval(sweepPollHandle);
  sweepPollHandle = setInterval(async () => {
    const run = await (await fetch(`/sweeps/${runId}`)).json();
    sweepRows = [run, ...sweepRows.filter(r => r.id !== runId)];
    renderSweeps(sweepRows);
    if (run.status !== 'running') clearInterval(sweepPollHandle);
  }, 3000);
}

function fmtDuration(startedAt, finishedAt, status) {
  if (status === 'running' || !finishedAt) return 'running…';
  const ms = new Date(finishedAt) - new Date(startedAt);
  if (!Number.isFinite(ms) || ms < 0) return '—';
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
}

// D-16: derived from the most recent FINISHED run's detail.sidecar.authExpired
// (rows are newest-first) — a badge for a source appears until a later
// finished sweep's detail no longer lists it, which this always reflects
// since it only ever reads the single latest finished row, never accumulates
// across runs.
function renderAuthBadges(rows) {
  const el = document.getElementById('sweepsBadges');
  const latestFinished = rows.find(r => r.status !== 'running' && r.detail);
  const authExpired = latestFinished?.detail?.sidecar?.authExpired || [];
  if (!authExpired.length) {
    el.innerHTML = '';
    return;
  }
  const labels = { yc: 'YC', jobright: 'Jobright' };
  el.innerHTML = authExpired
    .map(source => `<div class="auth-badge">${esc(labels[source] || source)} session expired — re-login (\`node scripts/seek-sidecar.mjs --login\`)</div>`)
    .join('');
}

function renderSweeps(rows) {
  renderAuthBadges(rows);
  const body = document.getElementById('sweepsBody');
  if (!rows.length) {
    body.innerHTML = `
      <div class="muted">no sweeps run yet</div>
      <div class="muted" style="font-size: 12px">trigger one above, or wait for the daily scheduled sweep.</div>`;
    return;
  }
  body.innerHTML = `
    <table>
      <thead><tr><th>started</th><th>trigger</th><th>duration</th><th>headline</th><th>status</th><th>detail</th></tr></thead>
      <tbody>
        ${rows.map(r => {
          const statusClass = SWEEP_STATUSES.has(r.status) ? `s-${r.status}` : 'muted';
          const h = r.detail?.headline;
          // Stored detail is untrusted at this innerHTML sink — coerce to
          // numbers, never interpolate raw (mirrors the batch headline).
          // tokenErrors / boardsAdded are phase-16 fields (D-03 per-token
          // isolation, D-11/D-14 slug harvest). Appended only when non-zero so
          // an ordinary sweep's summary stays as short as it was before.
          const extra = h
            ? `${Number(h.tokenErrors) ? ` · ${Number(h.tokenErrors)} token errors` : ''}${Number(h.boardsAdded) ? ` · ${Number(h.boardsAdded)} boards added` : ''}`
            : '';
          const headline = h ? `${Number(h.fetched) || 0} fetched · ${Number(h.rejected) || 0} rejected · ${Number(h.deduped) || 0} deduped · ${Number(h.held) || 0} held · ${Number(h.queued) || 0} queued${extra}` : '—';
          return `
            <tr>
              <td class="muted">${esc((r.started_at || '').replace('T', ' ').slice(0, 19))}</td>
              <td>${esc(r.trigger)}</td>
              <td>${fmtDuration(r.started_at, r.finished_at, r.status)}</td>
              <td>${headline}</td>
              <td><span class="${statusClass}">${esc(r.status)}</span></td>
              <td>
                ${r.detail ? `
                  <div class="sweep-toggle" onclick="toggleSweepDetail(${r.id})">per-source <span id="sarrow-${r.id}">▾</span></div>
                  <div id="sdetail-${r.id}" style="display:none">${renderSweepSourceDetail(r.detail)}</div>
                ` : `<span class="muted">in progress…</span>`}
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// detail.fetch is server-composed SourceResult[]; per-source error strings
// are third-party/network text and therefore untrusted — esc() every one,
// mirroring the failures table's snapshot rendering.
function renderSweepSourceDetail(detail) {
  // Per-source tokenErrors/boardsAdded (phase 16). Same untrusted-detail rule
  // as the headline: coerce counts to numbers, esc() any string that reaches
  // this innerHTML sink. sampleTokenErrors carries attacker-influenceable
  // upstream text, so each token is escaped individually.
  const fetchLines = (detail.fetch || [])
    .map(s => {
      const tokenErrors = Number(s.tokenErrors) || 0;
      const boardsAdded = Number(s.boardsAdded) || 0;
      const sample = tokenErrors && Array.isArray(s.sampleTokenErrors) && s.sampleTokenErrors.length
        ? ` (${s.sampleTokenErrors.slice(0, 5).map(e => esc(String(e?.token ?? ''))).join(', ')})`
        : '';
      return `<div class="muted" style="padding-left:4px">${esc(s.source)}: ${Number(s.fetched) || 0} fetched${s.upserted != null ? `, ${Number(s.upserted) || 0} upserted` : ''}${tokenErrors ? `, ${tokenErrors} token errors${sample}` : ''}${boardsAdded ? `, ${boardsAdded} boards added` : ''}${s.error ? ` — error: ${esc(s.error)}` : ''}</div>`;
    })
    .join('');
  const bc = detail.filter?.byCriterion || {};
  const criterionLine = `<div class="muted" style="padding-left:4px">rejected by criterion: location ${bc.location ?? 0} · title ${bc.title ?? 0} · yoe ${bc.yoe ?? 0} · stale ${bc.stale ?? 0} · grace ${bc.grace ?? 0} · llm ${bc.llm ?? 0}</div>`;
  const sidecarLine = detail.sidecar
    ? `<div class="muted" style="padding-left:4px">sidecar: ${detail.sidecar.ran ? 'ran' : 'did not run'}${detail.sidecar.error ? ` — error: ${esc(detail.sidecar.error)}` : ''}</div>`
    : '';
  return fetchLines + criterionLine + sidecarLine;
}

function toggleSweepDetail(id) {
  const body = document.getElementById(`sdetail-${id}`);
  const arrow = document.getElementById(`sarrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';
}

// BATCH-02/BATCH-03: batch fills run-history — mirrors the sweeps section's
// trigger/poll/detail pattern exactly. Status is untrusted server-authored state,
// allowlisted before it reaches a class attribute (stored-XSS sink), mirroring
// SWEEP_STATUSES above. Stop/skip/failed reasons are translated via fixed label
// maps below — no raw internal code (e.g. 'fill-failed', 'trigger-error') ever
// reaches the DOM (UI-SPEC Copywriting Contract).
const BATCH_STATUSES = new Set(['running', 'ok', 'failed']);
let batchRows = [];
let batchPollHandle = null;

const STOP_REASON_LABELS = {
  cap: 'stopped — reached the review backlog cap',
  'queue empty': 'stopped — no more eligible postings',
  'browser busy': "didn't start — browser busy, review pending tabs first",
  'circuit breaker': 'stopped early — 3 fills in a row failed',
  interrupted: 'stopped — run was interrupted (browser closed)',
};

const SKIP_REASON_LABELS = {
  'login-gated': 'skipped — login required',
  'not-fillable': 'skipped — not fillable',
  'unsupported-host': 'skipped — host not on allowlist',
};

const FAILED_REASON_LABELS = {
  'no-form': 'failed — no form rendered',
  'fill-failed': "failed — couldn't complete the fill",
  timeout: 'failed — timed out',
  'trigger-error': "failed — couldn't start the fill",
  duplicate: 'failed — already applied',
};

// Re-renders the queue after batchRows populates — REQUIRED, not optional. The
// "skipped last batch" badge cross-references batchRows, but loadQueue() and
// loadBatch() are independent unawaited fetches at page load (see bottom-of-file
// initial load), so batchRows is still [] on the queue's first render. Making
// loadBatch re-render the queue keeps badge correctness fetch-order-independent.
async function loadBatch() {
  batchRows = await (await fetch('/batch-runs')).json();
  renderBatch(batchRows);
  renderQueue(queueRows);
}

// Fire-and-poll (mirrors triggerSweep): reload-then-notify order. Two distinct 409
// notices — sweep running (D-08 mutual exclusion) vs batch already running.
async function triggerBatch() {
  const resp = await fetch('/batch', { method: 'POST' });
  const body = await resp.json();
  await loadBatch();
  if (resp.status === 409) {
    const notice = String(body.error || '').includes('sweep')
      ? "can't start batch — sweep is running, try again after it finishes"
      : `batch already running (run ${Number(body.runId) || ''})`;
    document.getElementById('batchBody').insertAdjacentHTML('afterbegin', `<div class="muted">${notice}</div>`);
    return;
  }
  if (resp.ok && body.id) pollBatch(body.id);
}

// Mirrors pollSweep — re-renders the in-progress run every ~3s, stops once status
// leaves 'running'. One extra loadBatch() on the terminal tick so the just-finished
// run's skip list badges the queue rows immediately.
function pollBatch(runId) {
  if (batchPollHandle) clearInterval(batchPollHandle);
  batchPollHandle = setInterval(async () => {
    const run = await (await fetch(`/batch-runs/${runId}`)).json();
    batchRows = [run, ...batchRows.filter(r => r.id !== runId)];
    renderBatch(batchRows);
    if (run.status !== 'running') {
      clearInterval(batchPollHandle);
      loadBatch();
    }
  }, 3000);
}

function renderBatch(rows) {
  const body = document.getElementById('batchBody');
  if (!rows.length) {
    body.innerHTML = `
      <div class="muted">no batch fills run yet</div>
      <div class="muted" style="font-size: 12px">trigger one above, or wait for the daily scheduled batch after today's sweep.</div>`;
    return;
  }
  body.innerHTML = `
    <table>
      <thead><tr><th>started</th><th>trigger</th><th>duration</th><th>headline</th><th>status</th><th>detail</th></tr></thead>
      <tbody>
        ${rows.map(r => {
          const statusClass = BATCH_STATUSES.has(r.status) ? `s-${r.status}` : 'muted';
          const h = r.detail?.headline;
          // Stored detail is untrusted at this innerHTML sink (PATCHable by
          // any authorized() client) — coerce to numbers, never interpolate raw.
          const headline = h ? `${Number(h.filled) || 0} filled · ${Number(h.skipped) || 0} skipped · ${Number(h.failed) || 0} failed` : '—';
          const stopReasonLine = r.status !== 'running' && r.detail?.stop_reason
            ? `<div class="muted">${esc(STOP_REASON_LABELS[r.detail.stop_reason] || r.detail.stop_reason)}</div>`
            : '';
          return `
            <tr>
              <td class="muted">${esc((r.started_at || '').replace('T', ' ').slice(0, 19))}</td>
              <td>${esc(r.trigger)}</td>
              <td>${fmtDuration(r.started_at, r.finished_at, r.status)}</td>
              <td>${headline}</td>
              <td><span class="${statusClass}">${esc(r.status)}</span>${stopReasonLine}</td>
              <td>
                ${r.detail ? `
                  <div class="batch-toggle" onclick="toggleBatchDetail(${r.id})">skips <span id="barrow-${r.id}">▾</span></div>
                  <div id="bdetail-${r.id}" style="display:none">${renderBatchDetail(r.detail)}</div>
                ` : `<span class="muted">in progress…</span>`}
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// detail.skipped/detail.failed carry third-party-derived company/role text
// (untrusted stored data) — esc() every one, mirroring renderSweepSourceDetail.
function renderBatchDetail(detail) {
  const skipLines = (detail.skipped || [])
    .map(s => `<div class="muted" style="padding-left:4px">${esc(s.company)} · ${esc(s.role)}: ${esc(SKIP_REASON_LABELS[s.reason] || s.reason)}</div>`)
    .join('');
  const failLines = (detail.failed || [])
    .map(f => `<div class="muted" style="padding-left:4px">${esc(f.company)} · ${esc(f.role)}: ${esc(FAILED_REASON_LABELS[f.reason] || f.reason)}</div>`)
    .join('');
  return skipLines + failLines;
}

function toggleBatchDetail(id) {
  const body = document.getElementById(`bdetail-${id}`);
  const arrow = document.getElementById(`barrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';
}

// -----------------------------------------------------------------------
// Settings tab — search criteria editor (CFG-01, D-08). Editing lives in the
// dashboard because only the helper can write jobfill.db; the extension
// cannot. See 18-UI-SPEC.md "Surface 1 — Search Criteria Editor".
// -----------------------------------------------------------------------

const CRITERIA_TERM_FIELDS = ['seniorityTerms', 'nonEngineeringTerms', 'locationTerms', 'workModeOnlyTerms'];
const CRITERIA_CAP_FIELDS = ['maxStaleDays', 'maxStaleDaysIndexed', 'maxFirstSeenDays'];

// The last object received from the server — the narrowing-check baseline,
// replaced only by a successful load or save, never by a keystroke.
let criteriaSnapshot = null;

async function loadSettings() {
  const body = document.getElementById('settingsCriteriaBody');
  body.innerHTML = `<div class="muted">loading search criteria…</div>`;
  try {
    const resp = await fetch('/settings/criteria');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    criteriaSnapshot = await resp.json();
    renderCriteria(criteriaSnapshot);
  } catch (e) {
    body.innerHTML = `<div class="muted" onclick="loadSettings()">couldn't load search criteria — click to retry</div>`;
  }
}

function renderCriteria(c) {
  const body = document.getElementById('settingsCriteriaBody');
  body.innerHTML = `
    <div class="settings-field">
      <label for="crit-seniorityTerms">reject titles containing (seniority)</label>
      <textarea id="crit-seniorityTerms" placeholder="senior&#10;principal&#10;sr.&#10;vp&#10;director&#10;head of" oninput="refreshCriteriaHints()">${esc(c.seniorityTerms.join('\n'))}</textarea>
      <div class="settings-hint" id="hint-seniorityTerms"></div>
    </div>
    <div class="settings-field">
      <label for="crit-nonEngineeringTerms">reject titles containing (non-engineering)</label>
      <textarea id="crit-nonEngineeringTerms" placeholder="product manager&#10;designer&#10;sales&#10;recruiter&#10;marketing" oninput="refreshCriteriaHints()">${esc(c.nonEngineeringTerms.join('\n'))}</textarea>
      <div class="settings-hint" id="hint-nonEngineeringTerms"></div>
    </div>
    <div class="settings-field">
      <label for="crit-locationTerms">accept locations containing</label>
      <textarea id="crit-locationTerms" placeholder="new york&#10;nyc&#10;san francisco&#10;remote&#10;united states" oninput="refreshCriteriaHints()">${esc(c.locationTerms.join('\n'))}</textarea>
      <div class="settings-hint" id="hint-locationTerms"></div>
    </div>
    <div class="settings-field">
      <label for="crit-workModeOnlyTerms">ignore these exact location values (not a real location)</label>
      <div class="settings-hint">matched only when the ENTIRE location field is exactly one of these — e.g. "hybrid" won't match "hybrid, nyc".</div>
      <textarea id="crit-workModeOnlyTerms" placeholder="hybrid&#10;in-office&#10;on-site&#10;full-time&#10;part-time&#10;contract&#10;flexible" oninput="refreshCriteriaHints()">${esc(c.workModeOnlyTerms.join('\n'))}</textarea>
      <div class="settings-hint" id="hint-workModeOnlyTerms"></div>
    </div>
    <div class="settings-checkbox-row">
      <input type="checkbox" id="crit-staffLeadBuiltins" ${c.staffLeadBuiltins ? 'checked' : ''} onchange="refreshCriteriaHints()">
      <label for="crit-staffLeadBuiltins" style="margin-bottom:0">reject staff/lead engineering titles automatically (built-in, not editable)</label>
    </div>
    <div class="settings-hint" style="margin-top:-8px; margin-bottom:16px">on by default. rejects titles like "staff software engineer" while letting "member of technical staff" through — this logic lives in code and can't be edited here, only turned off.</div>
    <div class="settings-subhead">posting age limits</div>
    <div class="settings-field">
      <label for="crit-maxStaleDays">max age for postings with a trusted date (days)</label>
      <input type="number" id="crit-maxStaleDays" min="1" max="365" value="${c.maxStaleDays}" oninput="refreshCriteriaHints()">
      <div class="settings-hint" id="hint-maxStaleDays"></div>
    </div>
    <div class="settings-field">
      <label for="crit-maxStaleDaysIndexed">max age for index-only sources like Simplify/Getro (days)</label>
      <input type="number" id="crit-maxStaleDaysIndexed" min="1" max="365" value="${c.maxStaleDaysIndexed}" oninput="refreshCriteriaHints()">
      <div class="settings-hint" id="hint-maxStaleDaysIndexed"></div>
    </div>
    <div class="settings-field">
      <label for="crit-maxFirstSeenDays">max time since jobfill first saw a posting from Greenhouse/YC (days)</label>
      <input type="number" id="crit-maxFirstSeenDays" min="1" max="365" value="${c.maxFirstSeenDays}" oninput="refreshCriteriaHints()">
      <div class="settings-hint" id="hint-maxFirstSeenDays"></div>
    </div>
    <div class="settings-hint" style="margin-top:-12px; margin-bottom:16px">postings older than these limits are rejected as stale before reaching the relevance check.</div>
    <div class="settings-field">
      <label for="crit-yoeThreshold">reject postings requiring more than this many years of experience</label>
      <input type="number" id="crit-yoeThreshold" min="0" max="50" placeholder="no cap" value="${c.yoeThreshold === null ? '' : c.yoeThreshold}" oninput="refreshCriteriaHints()">
      <div class="settings-hint" id="hint-yoeThreshold"></div>
    </div>
    <div class="settings-summary" id="criteriaSummary"></div>
    <div class="settings-actions">
      <button id="criteriaSaveBtn" class="primary" onclick="saveCriteria()">save search criteria</button>
      <span class="settings-hint" id="criteriaSaveError"></span>
    </div>`;
  refreshCriteriaHints();
}

// The single place the form is translated into the endpoint's shape, so the
// summary, the validation and the save can never disagree about what the
// user typed.
function readCriteriaForm() {
  const termList = (id) => document.getElementById(id).value.split('\n').map((s) => s.trim()).filter(Boolean);
  const yoeRaw = document.getElementById('crit-yoeThreshold').value;
  return {
    seniorityTerms: termList('crit-seniorityTerms'),
    nonEngineeringTerms: termList('crit-nonEngineeringTerms'),
    locationTerms: termList('crit-locationTerms'),
    workModeOnlyTerms: termList('crit-workModeOnlyTerms'),
    staffLeadBuiltins: document.getElementById('crit-staffLeadBuiltins').checked,
    maxStaleDays: Number(document.getElementById('crit-maxStaleDays').value),
    maxStaleDaysIndexed: Number(document.getElementById('crit-maxStaleDaysIndexed').value),
    maxFirstSeenDays: Number(document.getElementById('crit-maxFirstSeenDays').value),
    yoeThreshold: yoeRaw === '' ? null : Number(yoeRaw),
  };
}

// refreshCriteriaHints recomputes hint/summary/validation text from
// readCriteriaForm() with no network call and no debounce — wired to every
// field's oninput/onchange and called once after render so the form is
// correct before any interaction.
function refreshCriteriaHints() {
  const c = readCriteriaForm();

  const setHint = (fieldId, text, isError = false) => {
    const el = document.getElementById(`hint-${fieldId}`);
    if (!el) return;
    el.innerHTML = esc(text);
    el.classList.toggle('rule-error', isError);
  };

  setHint('seniorityTerms', c.seniorityTerms.length
    ? `${c.seniorityTerms.length} terms · titles matching any of these are rejected`
    : `0 terms · this rule is off — no title is rejected for seniority wording`);
  setHint('nonEngineeringTerms', c.nonEngineeringTerms.length
    ? `${c.nonEngineeringTerms.length} terms · titles matching any of these are rejected`
    : `0 terms · this rule is off — no title is rejected as non-engineering`);
  setHint('locationTerms', c.locationTerms.length
    ? `${c.locationTerms.length} terms · a posting is rejected only if its location matches none of these`
    : `0 terms · location filtering is off — every posting reaches the relevance check regardless of where it's based`);
  setHint('workModeOnlyTerms', c.workModeOnlyTerms.length
    ? `${c.workModeOnlyTerms.length} terms`
    : `0 terms · this rule is off — no location value is treated as mode-only noise`);
  setHint('yoeThreshold', c.yoeThreshold === null
    ? `no cap set · postings aren't filtered by years-of-experience wording`
    : `postings mentioning more than ${c.yoeThreshold} years of experience are rejected`);
  setHint('maxStaleDays', '');
  setHint('maxStaleDaysIndexed', '');
  setHint('maxFirstSeenDays', '');

  const summary = document.getElementById('criteriaSummary');
  if (summary) {
    summary.textContent = `active rules — seniority: ${c.seniorityTerms.length} terms · non-engineering: ${c.nonEngineeringTerms.length} terms · location: ${c.locationTerms.length} terms${c.locationTerms.length === 0 ? ' (off)' : ''} · work-mode-neutral: ${c.workModeOnlyTerms.length} terms · staff/lead heuristics: ${c.staffLeadBuiltins ? 'on' : 'off'} · age caps: ${c.maxStaleDays}/${c.maxStaleDaysIndexed}/${c.maxFirstSeenDays} days · yoe cap: ${c.yoeThreshold === null ? 'none' : c.yoeThreshold}`;
  }
}

// Tab navigation: one visible group at a time, persisted in the URL hash so a
// reload (or a bookmarked #runs) lands where the operator left off. All sections stay in
// the DOM and keep loading/rendering as before — tabs only control visibility.
const TABS = ['queue', 'runs', 'applications', 'library', 'failures', 'settings'];
function setTab(name) {
  if (!TABS.includes(name)) name = 'queue';
  for (const el of document.querySelectorAll('[data-tab]')) {
    el.classList.toggle('tab-visible', el.dataset.tab === name);
  }
  for (const b of document.querySelectorAll('[data-tabbtn]')) {
    b.classList.toggle('active', b.dataset.tabbtn === name);
  }
  if (location.hash !== `#${name}`) history.replaceState(null, '', `#${name}`);
}
setTab(location.hash.replace('#', '') || 'queue');

load();
loadLibrary();
loadFailures();
loadQueue();
loadPostings();
loadSweeps();
loadBatch();
loadSettings();
</script>
