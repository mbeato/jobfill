<!doctype html>
<meta charset="utf-8">
<title>jobfill tracker</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  #stats { color: #777; margin-bottom: 16px; }
  .filters button { margin-right: 6px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .filters button.active { background: #222; color: #fff; border-color: #222; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; color: #888; }
  select { padding: 3px; }
  input.notes { width: 100%; box-sizing: border-box; border: 1px solid transparent; padding: 3px; }
  input.notes:hover, input.notes:focus { border-color: #ccc; }
  .muted { color: #999; font-size: 12px; }
  .s-applied { color: #555; } .s-replied { color: #1565c0; } .s-interviewing { color: #e65100; }
  .s-offer { color: #2e7d32; font-weight: 600; } .s-rejected { color: #999; }
  a { color: #1565c0; text-decoration: none; }
  .summary-toggle { cursor: pointer; margin-top: 2px; }
  h2 { font-size: 16px; font-weight: 600; line-height: 1.2; margin-top: 32px; }
  .answer-block { background: #fff8dc; padding: 8px; overflow: hidden; }
  textarea.answer-edit { width: 100%; box-sizing: border-box; border: 1px solid transparent; padding: 8px; background: #fff8dc; }
  textarea.answer-edit:focus { border-color: #ccc; }
  .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .versions-toggle { color: #1565c0; cursor: pointer; }
  .pin-btn.pinned { color: #2e7d32; font-weight: 600; }
  .pin-btn { color: #999; cursor: pointer; }
  .delete-btn { color: #d32f2f; cursor: pointer; }
  .s-verify, .s-needs_manual, .s-error { color: #e65100; }
  .s-didnt_stick { color: #d32f2f; font-weight: 600; }
  .s-not_found, .s-stale { color: #999; }
  .s-partial { color: #e65100; }
  .s-frame_error { color: #e65100; }
  .failure-toggle { color: #1565c0; cursor: pointer; }
  .snapshot { background: #f5f5f5; padding: 8px; max-height: 160px; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.4; }
  .s-queued { color: #999; } .s-filling { color: #e65100; } .s-filled { color: #2e7d32; }
  .s-failed { color: #d32f2f; } .s-reviewed { color: #1565c0; } .s-submitted { color: #2e7d32; font-weight: 600; }
  .queue-toggle { color: #1565c0; cursor: pointer; }
  .queue-actions button { margin-right: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .d-queued { color: #2e7d32; }
  .d-rejected { color: #999; }
  .d-held { color: #e65100; }
  .seek-actions button { margin-right: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .decision-toggle { color: #1565c0; cursor: pointer; }
  .sweep-actions button { margin-right: 8px; padding: 4px 10px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
  .s-running { color: #e65100; } .s-ok { color: #2e7d32; }
  .sweep-toggle { color: #1565c0; cursor: pointer; }
  .auth-badge { color: #d32f2f; font-weight: 600; margin: 4px 0; }
</style>
<body>
  <h1>jobfill tracker</h1>
  <div id="stats"></div>
  <div id="queue">
    <h2>posting queue</h2>
    <div id="queueBody"></div>
  </div>
  <div id="sweeps">
    <h2>sweeps</h2>
    <div class="sweep-actions"><button onclick="triggerSweep()">Trigger sweep now</button></div>
    <div id="sweepsBadges"></div>
    <div id="sweepsBody"></div>
  </div>
  <div id="seek">
    <h2>seek decisions</h2>
    <div id="seekStats"></div>
    <div class="filters" id="seekFilters"></div>
    <div id="seekBody"></div>
  </div>
  <div class="filters" id="filters"></div>
  <table>
    <thead><tr><th>date</th><th>company</th><th>role</th><th>status</th><th>notes</th><th>links</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="library">
    <h2>answer library</h2>
    <div id="libraryBody"></div>
  </div>
  <div id="failures">
    <h2>widget failures</h2>
    <div id="failuresBody"></div>
  </div>
<script>
const STATUSES = ['applied', 'replied', 'interviewing', 'offer', 'rejected'];
let apps = [];
let filter = 'all';

async function load() {
  apps = await (await fetch('/applications')).json();
  render();
}

function render() {
  const shown = filter === 'all' ? apps : apps.filter(a => a.status === filter);
  const spend = apps.reduce((s, a) => s + (a.cost_usd || 0), 0);
  const active = apps.filter(a => !['rejected'].includes(a.status)).length;
  document.getElementById('stats').textContent =
    `${apps.length} applications · ${active} active · $${spend.toFixed(2)} api spend`;

  document.getElementById('filters').innerHTML = ['all', ...STATUSES]
    .map(s => `<button class="${filter === s ? 'active' : ''}" onclick="filter='${s}';render()">${s}${s === 'all' ? '' : ` (${apps.filter(a => a.status === s).length})`}</button>`)
    .join('');

  document.getElementById('rows').innerHTML = shown.map(a => `
    <tr>
      <td class="muted">${(a.created_at || '').slice(0, 10)}</td>
      <td><strong>${esc(a.company)}</strong></td>
      <td>${esc(a.role)}</td>
      <td><select class="s-${a.status}" onchange="patch(${a.id}, {status: this.value})">
        ${STATUSES.map(s => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}
      </select></td>
      <td><input class="notes" value="${esc(a.notes)}" placeholder="notes…"
        onchange="patch(${a.id}, {notes: this.value})"></td>
      <td>
        ${a.url ? `<a href="${esc(a.url)}" target="_blank">posting</a>` : ''}
        ${a.resume_path ? `<div class="muted" title="${esc(a.resume_path)}">resume: …/${esc(a.resume_path.split('/').slice(-2).join('/'))}</div>` : ''}
        ${tailorStateLine(a.tailor_state, a.tailor_message)}
        ${a.summary ? `
          <div class="muted summary-toggle" onclick="toggleSummary(${a.id})">resume changes <span id="arrow-${a.id}">▾</span></div>
          <div class="summary-body" id="summary-${a.id}" style="display:none">
            ${a.summary.map(line => `<div class="muted" style="padding-left:4px">${esc(line)}</div>`).join('')}
          </div>
        ` : ''}
      </td>
    </tr>`).join('');
}

async function patch(id, body) {
  await fetch(`/applications/${id}`, {
    method: 'PATCH',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  load();
}

function toggleSummary(id) {
  const body = document.getElementById(`summary-${id}`);
  const arrow = document.getElementById(`arrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// OBS-01: always-visible tailor-state line — unlike the resume-changes toggle above
// (gated on a.summary truthiness), this renders for every fill regardless of summary.
function tailorStateLine(tailorState, tailorMessage) {
  if (tailorState === 'ran') return `<div class="muted">tailored resume attached</div>`;
  if (tailorState === 'skipped') return `<div class="muted">static resume — ${esc(tailorMessage)}</div>`;
  if (tailorState === 'error') return `<div style="color:#e65100">tailor failed — ${esc(tailorMessage)} · static resume used</div>`;
  return '';
}

async function loadLibrary() {
  const groups = await (await fetch('/answers')).json();
  renderLibrary(groups);
}

function renderVersionRow(v) {
  return `
    <div style="padding-left: 4px; margin-top: 6px;">
      <div class="muted clamp-3">${esc(v.answer)}</div>
      <div class="muted">${(v.created_at || '').slice(0, 10)}
        <span class="pin-btn ${v.pinned ? 'pinned' : ''}" onclick="patchAnswer(${v.id}, {pinned: ${v.pinned ? 0 : 1}})">${v.pinned ? 'pinned' : 'pin'}</span>
        · <span class="delete-btn" onclick="deleteAnswer(${v.id})">delete</span>
      </div>
    </div>`;
}

function renderLibrary(groups) {
  const body = document.getElementById('libraryBody');
  if (!groups.length) {
    body.innerHTML = `
      <div class="muted">no answers banked yet</div>
      <div class="muted" style="font-size: 12px">capture answers from the popup after filling a form with essay questions.</div>`;
    return;
  }
  body.innerHTML = `
    <table>
      <thead><tr><th>question</th><th>answer</th><th>captured</th><th>actions</th></tr></thead>
      <tbody>
        ${groups.map(g => {
          const best = g.best;
          return `
            <tr>
              <td style="text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 280px">${esc(g.question)}</td>
              <td><textarea class="answer-edit" rows="4" onchange="patchAnswer(${best.id}, {answer: this.value})">${esc(best.answer)}</textarea></td>
              <td>
                <div class="muted">${(best.created_at || '').slice(0, 10)}</div>
                ${g.versions.length ? `
                  <div class="versions-toggle" onclick="toggleVersions(${best.id})">${g.versions.length} older version${g.versions.length === 1 ? '' : 's'} <span id="varrow-${best.id}">▾</span></div>
                  <div id="versions-${best.id}" style="display:none">
                    ${g.versions.map(renderVersionRow).join('')}
                  </div>
                ` : ''}
              </td>
              <td>
                <span class="pin-btn ${best.pinned ? 'pinned' : ''}" onclick="patchAnswer(${best.id}, {pinned: ${best.pinned ? 0 : 1}})">${best.pinned ? 'pinned' : 'pin'}</span>
                · <span class="delete-btn" onclick="deleteAnswer(${best.id})">delete</span>
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function toggleVersions(id) {
  const body = document.getElementById(`versions-${id}`);
  const arrow = document.getElementById(`varrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';
}

async function patchAnswer(id, body) {
  await fetch(`/answers/${id}`, {
    method: 'PATCH',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  loadLibrary();
}

async function deleteAnswer(id) {
  if (!confirm("delete this answer? this can't be undone")) return;
  await fetch(`/answers/${id}`, { method: 'DELETE' });
  loadLibrary();
}

async function loadFailures() {
  const rows = await (await fetch('/failures')).json();
  renderFailures(rows);
}

function hostnameOf(url) {
  try {
    return new URL(url).hostname;
  } catch {
    return url || '';
  }
}

// Statuses are allowlisted at render — the store is untrusted (POST body), so an
// unknown status must never reach the class attribute (stored-XSS sink).
const FAILURE_STATUSES = ['verify', 'needs_manual', 'error', 'didnt_stick', 'not_found', 'stale'];

function renderFailures(rows) {
  const body = document.getElementById('failuresBody');
  if (!rows.length) {
    body.innerHTML = `
      <div class="muted">no widget failures captured yet</div>
      <div class="muted" style="font-size: 12px">failures are captured automatically while filling — nothing to review until a combobox or custom widget misfires.</div>`;
    return;
  }
  body.innerHTML = `
    <table>
      <thead><tr><th>date</th><th>page</th><th>field</th><th>status</th><th>details</th></tr></thead>
      <tbody>
        ${rows.map(r => {
          const optionsSeen = Array.isArray(r.options_seen) ? r.options_seen : [];
          const isCombobox = r.widget_kind === 'combobox';
          const shown = optionsSeen.slice(0, 20);
          const more = optionsSeen.length > 20 ? ` +${optionsSeen.length - 20} more` : '';
          const ariaText = r.list_resolved_via_aria === null ? 'unknown' : (r.list_resolved_via_aria ? 'yes' : 'no');
          const statusClass = FAILURE_STATUSES.includes(r.status) ? `s-${r.status}` : 'muted';
          // WR-01: stored urls are untrusted — only emit an anchor for http(s) schemes.
          const safeUrl = /^https?:\/\//i.test(r.url) ? r.url : '';
          return `
            <tr>
              <td class="muted">${(r.created_at || '').slice(0, 10)}</td>
              <td style="text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 280px">
                ${safeUrl ? `<a href="${esc(safeUrl)}" target="_blank">${esc(hostnameOf(safeUrl))}</a>` : esc(hostnameOf(r.url))}
              </td>
              <td>${esc(r.field_label)}${r.widget_kind ? `<span class="muted"> · ${esc(r.widget_kind)}</span>` : ''}</td>
              <td><span class="${statusClass}">${esc(r.status)}</span></td>
              <td>
                <div class="failure-toggle" onclick="toggleFailureDetails(${r.id})">details <span id="farrow-${r.id}">▾</span></div>
                <div id="fdetails-${r.id}" style="display:none; padding-left: 4px">
                  <div class="muted clamp-3">${esc(r.mapped_value)}</div>
                  <pre class="snapshot">${esc(r.outer_html)}</pre>
                  ${isCombobox ? `
                    <div class="muted">options seen (${optionsSeen.length}): ${esc(shown.join(', '))}${esc(more)}</div>
                    <div class="muted">list resolved via aria-controls/aria-owns: ${ariaText}</div>
                  ` : ''}
                </div>
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

function toggleFailureDetails(id) {
  const body = document.getElementById(`fdetails-${id}`);
  const arrow = document.getElementById(`farrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';
}

// Queue statuses are allowlisted at render — the store is untrusted (POST/PATCH body),
// so an unknown status must never reach the class attribute (stored-XSS sink), mirroring
// FAILURE_STATUSES above.
const QUEUE_STATUSES = ['queued', 'filling', 'filled', 'failed', 'reviewed', 'submitted'];
// Resolved in the Task 3 checkpoint: replace with the real unpacked extension id
// from chrome://extensions (Assumption A1).
const EXTENSION_ID = 'ppjcjpmmaenfcjaoedhggdmpomkdcaha';
let queueRows = [];

async function loadQueue() {
  queueRows = await (await fetch('/queue')).json();
  renderQueue(queueRows);
}

function triggerFill(id) {
  const q = queueRows.find(r => r.id === id);
  if (!q) return;
  if (typeof chrome === 'undefined' || !chrome.runtime) {
    document.getElementById('queueBody').insertAdjacentHTML('afterbegin', `<div class="muted">extension not detected</div>`);
    return;
  }
  chrome.runtime.sendMessage(EXTENSION_ID, { type: 'jobfill.trigger', queueId: q.id, url: q.url }, async (resp) => {
    // Always read lastError (silences "Unchecked runtime.lastError") and surface
    // outcomes the queue row itself won't show (unreachable / duplicate / error).
    let notice = '';
    if (chrome.runtime.lastError) {
      notice = `extension not reachable — ${esc(chrome.runtime.lastError.message)}`;
    } else if (resp?.state === 'duplicate') {
      notice = `already applied to ${esc(resp.prior?.company || '')} — use the popup's Fill anyway`;
    } else if (resp?.state === 'error') {
      notice = `fill failed — ${esc(resp.error || '')}`;
    }
    // reload first: renderQueue replaces queueBody's innerHTML and would wipe the notice
    await loadQueue();
    if (notice) {
      document.getElementById('queueBody').insertAdjacentHTML('afterbegin', `<div class="muted">${notice}</div>`);
    }
  });
}

// D-02: the ONLY code path in the whole system that constructs a 'submitted' status —
// no background/helper code sets it. Gated behind a human confirm() click.
function markSubmitted(id) {
  const q = queueRows.find(r => r.id === id);
  if (!q) return;
  if (!confirm(`mark ${q.company} submitted? this records that you already submitted it manually — jobfill never submits for you.`)) return;
  patchQueue(id, { status: 'submitted' });
}

async function patchQueue(id, body) {
  await fetch(`/queue/${id}`, {
    method: 'PATCH',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  loadQueue();
}

function renderQueue(rows) {
  const body = document.getElementById('queueBody');
  if (!rows.length) {
    body.innerHTML = `
      <div class="muted">no postings queued yet</div>
      <div class="muted" style="font-size: 12px">add a posting URL from the popup, or POST it to /queue, to start the queue.</div>`;
    return;
  }
  body.innerHTML = `
    <table>
      <thead><tr><th>date</th><th>company / role</th><th>url</th><th>status</th><th>results</th><th>actions</th></tr></thead>
      <tbody>
        ${rows.map(q => {
          const statusClass = QUEUE_STATUSES.includes(q.status) ? `s-${q.status}` : 'muted';
          // results_summary is a JSON STRING written by background.js (JSON.stringify of the
          // per-field results array) — never a display string. Guard the parse; on failure or
          // empty input, render nothing rather than injecting the raw string into the DOM.
          let results;
          try {
            results = JSON.parse(q.results_summary || '{}');
          } catch {
            results = null;
          }
          const resultsHtml = renderQueueResults(results);
          // WR-01-style guard (mirrors the failures table): stored urls are untrusted —
          // esc() does not neutralize a javascript: scheme, so only emit an anchor for http(s).
          const safeUrl = /^https?:\/\//i.test(q.url) ? q.url : '';
          return `
            <tr>
              <td class="muted">${(q.created_at || '').slice(0, 10)}</td>
              <td><strong>${esc(q.company)}</strong>${q.role ? ` · ${esc(q.role)}` : ''}</td>
              <td style="text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 240px">
                ${safeUrl ? `<a href="${esc(safeUrl)}" target="_blank">${esc(safeUrl)}</a>` : esc(q.url)}
              </td>
              <td><span class="${statusClass}">${esc(q.status)}</span>
                ${q.status === 'failed' ? `<div class="muted">fill failed — ${esc(q.error)}. check the field results below, or retry from the popup.</div>` : ''}
              </td>
              <td>
                <div class="muted queue-toggle" onclick="toggleQueueResults(${q.id})">results <span id="qarrow-${q.id}">▾</span></div>
                <div id="qresults-${q.id}" style="display:none">${resultsHtml}</div>
              </td>
              <td class="queue-actions">
                <button onclick="triggerFill(${q.id})" ${q.status === 'filling' ? 'disabled' : ''}>Fill now</button>
                <button onclick="patchQueue(${q.id}, {status: 'reviewed'})">mark reviewed</button>
                <button onclick="markSubmitted(${q.id})">mark submitted</button>
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// results is either a parsed per-field results object/array (JSON.parse succeeded) or
// null (parse failed / empty) — never render the raw unparsed string.
// Statuses are allowlisted at render — results_summary is untrusted, server-stored JSON
// influenced by the LLM mapping call, so an unknown status must never reach the class
// attribute (stored-XSS sink), mirroring FAILURE_STATUSES above.
const QUEUE_REVIEW_STATUSES = new Set(['verify', 'needs_manual', 'error', 'partial', 'not_found', 'stale', 'frame_error']);
function renderQueueResults(results) {
  if (!results) return `<div class="muted" style="padding-left:4px">no summary</div>`;
  const items = Array.isArray(results) ? results : Object.entries(results).map(([k, v]) => ({ label: k, ...(typeof v === 'object' && v ? v : { value: v }) }));
  if (!items.length) return `<div class="muted" style="padding-left:4px">no summary</div>`;
  return items.map(r => {
    const cls = QUEUE_REVIEW_STATUSES.has(r.status) ? `s-${r.status}` : 'muted';
    const stuckNote = r.stuck === false ? ` <span class="s-didnt_stick">didn't stick — check this field</span>` : '';
    return `<div class="${cls}" style="padding-left:4px">${esc(r.label || r.id || '')}: ${esc(r.status || r.value || '')}${stuckNote}</div>`;
  }).join('');
}

function toggleQueueResults(id) {
  const body = document.getElementById(`qresults-${id}`);
  const arrow = document.getElementById(`qarrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';
}

// D-15/FILT-04: seek decisions section. Two independent scopes on one screen —
// #seekStats is the persisted LAST SWEEP summary (from GET /seek/last, server-
// authored counts, never derived from #seekBody's rows), while #seekFilters'
// counts and #seekBody's table are the CURRENT, browsable state across all
// /postings rows. Mirrors QUEUE_STATUSES: decision is untrusted stored state,
// so it's allowlisted before it reaches a class attribute (stored-XSS sink).
const DECISION_VALUES = new Set(['queued', 'rejected', 'held']);
let lastSweep = null;
let postingsRows = [];
let seekFilter = 'all';
let seekBreakdownExpanded = false;

async function loadPostings() {
  [lastSweep, postingsRows] = await Promise.all([
    fetch('/seek/last').then(r => r.json()),
    fetch('/postings').then(r => r.json()),
  ]);
  renderSeekStats(lastSweep);
  renderSeekFilters(postingsRows);
  renderPostings(postingsRows);
}

// Translates a stored decision_reason code into the operator-facing copy — never render
// a raw code (UI-SPEC Reason Label Map). The llm: branches carry an untrusted
// LLM-derived one-liner about third-party JD content, so it's esc()-escaped here.
function reasonLabel(code) {
  if (!code) return '—';
  if (code === 'rules:location') return 'rejected — not NY/SF-based or remote-friendly';
  if (code === 'rules:title') return 'rejected — title outside target roles';
  if (code === 'rules:yoe') return 'rejected — requires more experience than target (incl. seniority-marker titles)';
  if (code === 'rules:stale') return 'rejected — posted more than 2 days ago';
  if (code.startsWith('llm:not-relevant')) {
    return `not relevant — ${esc(code.replace(/^llm:not-relevant\s*—\s*/, ''))}`;
  }
  if (code.startsWith('llm:relevant')) {
    return `relevant — ${esc(code.replace(/^llm:relevant\s*—\s*/, ''))}`;
  }
  if (code === 'queued: manual') return 'queued manually by the operator';
  if (code === 'held:jd-fetch-error') return 'held: could not fetch job description — will retry next sweep';
  if (code === 'held:llm-error') return 'held: LLM check failed — will retry next sweep';
  if (code.startsWith('dedupe:')) return 'duplicate — already queued or applied';
  if (code.startsWith('rules:')) return 'rejected — did not match target criteria';
  return esc(code);
}

function toggleSeekBreakdown() {
  seekBreakdownExpanded = !seekBreakdownExpanded;
  renderSeekStats(lastSweep);
}

// lastSweep's numeric counts (fetched/rejected/held/queued/byCriterion/deduped)
// are server-authored — rendered as numbers, never as raw HTML (T-10-11).
function renderSeekStats(ls) {
  const el = document.getElementById('seekStats');
  if (!ls) {
    el.innerHTML = `<div class="muted">no seek sweep run yet</div>`;
    return;
  }
  const summary = `${ls.fetched} fetched · ${ls.rejected} rejected · ${ls.held} held · ${ls.queued} queued`;
  if (!ls.rejected) {
    el.innerHTML = `<div>${summary}</div>`;
    return;
  }
  const bc = ls.byCriterion || {};
  const toggleTitle = seekBreakdownExpanded ? 'hide rejection breakdown' : 'show rejection breakdown';
  const breakdown = seekBreakdownExpanded
    ? ` (location ${bc.location ?? 0} · title ${bc.title ?? 0} · yoe ${bc.yoe ?? 0} · stale ${bc.stale ?? 0} · llm ${bc.llm ?? 0} · duplicate ${ls.deduped ?? 0})`
    : '';
  el.innerHTML = `<div>${summary}
    <span class="decision-toggle" title="${toggleTitle}" onclick="toggleSeekBreakdown()">${seekBreakdownExpanded ? '▴' : '▾'}</span><span class="muted">${breakdown}</span>
  </div>`;
}

function renderSeekFilters(rows) {
  const counts = {
    all: rows.length,
    queued: rows.filter(r => r.decision === 'queued').length,
    rejected: rows.filter(r => r.decision === 'rejected').length,
    held: rows.filter(r => r.decision === 'held').length,
    unscored: rows.filter(r => r.decision == null).length,
  };
  document.getElementById('seekFilters').innerHTML = ['all', 'queued', 'rejected', 'held', 'unscored']
    .map(s => `<button class="${seekFilter === s ? 'active' : ''}" onclick="seekFilter='${s}';renderPostings(postingsRows)">${s} (${counts[s]})</button>`)
    .join('');
}

function renderPostings(rows) {
  const body = document.getElementById('seekBody');
  if (!rows.length) {
    body.innerHTML = `
      <div class="muted">no postings decided yet</div>
      <div class="muted" style="font-size: 12px">run a seek sweep (\`bun run seek\`) to discover and filter postings.</div>`;
    return;
  }
  const shown = seekFilter === 'all' ? rows
    : seekFilter === 'unscored' ? rows.filter(r => r.decision == null)
    : rows.filter(r => r.decision === seekFilter);
  if (!shown.length) {
    body.innerHTML = `<div class="muted">no postings match this filter</div>`;
    return;
  }
  body.innerHTML = `
    <table>
      <thead><tr><th>date</th><th>company / role</th><th>source</th><th>decision</th><th>reason</th><th>action</th></tr></thead>
      <tbody>
        ${shown.map(p => {
          const decisionClass = DECISION_VALUES.has(p.decision) ? `d-${p.decision}` : 'muted';
          const decisionLabel = p.decision ? esc(p.decision) : '—';
          return `
            <tr>
              <td class="muted">${(p.fetched_at || '').slice(0, 10)}</td>
              <td><strong>${esc(p.company)}</strong> · ${esc(p.title)}</td>
              <td>${esc(p.source)}</td>
              <td><span class="${decisionClass}">${decisionLabel}</span></td>
              <td class="muted">${reasonLabel(p.decision_reason)}</td>
              <td class="seek-actions">
                ${p.decision === 'rejected' || p.decision === 'held' ? `<button onclick="queueReject(${p.id})">queue anyway</button>` : ''}
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// Additive/promotive override (D-16) — no confirm() dialog, matching the
// non-destructive "mark reviewed" button. Reloads first so the two re-renders
// don't wipe an inserted notice (mirrors triggerFill's reload-then-notify order).
async function queueReject(id) {
  const resp = await (await fetch(`/postings/${id}/promote`, { method: 'POST' })).json();
  await loadPostings();
  await loadQueue();
  if (resp && resp.promoted === false) {
    document.getElementById('seekBody').insertAdjacentHTML('afterbegin', `<div class="muted">already queued or applied</div>`);
  }
}

// D-14/D-16: sweeps run-history — last-N-runs list with per-source
// expandable detail, in-progress polling, a manual trigger button on the
// identical POST /sweep path the CLI and scheduler tick use, and an
// auth-expired badge. Status is untrusted server-authored state, allowlisted
// before it reaches a class attribute (stored-XSS sink), mirroring
// FAILURE_STATUSES/QUEUE_STATUSES/DECISION_VALUES above.
const SWEEP_STATUSES = new Set(['running', 'ok', 'failed']);
let sweepRows = [];
let sweepPollHandle = null;

async function loadSweeps() {
  sweepRows = await (await fetch('/sweeps')).json();
  renderSweeps(sweepRows);
}

// Fire-and-poll (D-10): mirrors triggerFill's reload-first-then-notify
// order. A 409 (already running) is a friendly notice, not a thrown error.
async function triggerSweep() {
  const resp = await fetch('/sweep', { method: 'POST' });
  const body = await resp.json();
  await loadSweeps();
  if (resp.status === 409) {
    document.getElementById('sweepsBody').insertAdjacentHTML('afterbegin', `<div class="muted">sweep already running (run ${Number(body.runId) || ''})</div>`);
    return;
  }
  if (resp.ok && body.id) pollSweep(body.id);
}

// Polling primitive (11-RESEARCH Code Examples) — re-renders the in-progress
// run at the top of the list every ~3s, stops once status leaves 'running'.
// A single active poll handle is guarded so a second trigger during an
// existing poll doesn't stack intervals.
function pollSweep(runId) {
  if (sweepPollHandle) clearInterval(sweepPollHandle);
  sweepPollHandle = setInterval(async () => {
    const run = await (await fetch(`/sweeps/${runId}`)).json();
    sweepRows = [run, ...sweepRows.filter(r => r.id !== runId)];
    renderSweeps(sweepRows);
    if (run.status !== 'running') clearInterval(sweepPollHandle);
  }, 3000);
}

function fmtDuration(startedAt, finishedAt, status) {
  if (status === 'running' || !finishedAt) return 'running…';
  const ms = new Date(finishedAt) - new Date(startedAt);
  if (!Number.isFinite(ms) || ms < 0) return '—';
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
}

// D-16: derived from the most recent FINISHED run's detail.sidecar.authExpired
// (rows are newest-first) — a badge for a source appears until a later
// finished sweep's detail no longer lists it, which this always reflects
// since it only ever reads the single latest finished row, never accumulates
// across runs.
function renderAuthBadges(rows) {
  const el = document.getElementById('sweepsBadges');
  const latestFinished = rows.find(r => r.status !== 'running' && r.detail);
  const authExpired = latestFinished?.detail?.sidecar?.authExpired || [];
  if (!authExpired.length) {
    el.innerHTML = '';
    return;
  }
  const labels = { yc: 'YC', jobright: 'Jobright' };
  el.innerHTML = authExpired
    .map(source => `<div class="auth-badge">${esc(labels[source] || source)} session expired — re-login (\`node scripts/seek-sidecar.mjs --login\`)</div>`)
    .join('');
}

function renderSweeps(rows) {
  renderAuthBadges(rows);
  const body = document.getElementById('sweepsBody');
  if (!rows.length) {
    body.innerHTML = `
      <div class="muted">no sweeps run yet</div>
      <div class="muted" style="font-size: 12px">trigger one above, or wait for the daily scheduled sweep.</div>`;
    return;
  }
  body.innerHTML = `
    <table>
      <thead><tr><th>started</th><th>trigger</th><th>duration</th><th>headline</th><th>status</th><th>detail</th></tr></thead>
      <tbody>
        ${rows.map(r => {
          const statusClass = SWEEP_STATUSES.has(r.status) ? `s-${r.status}` : 'muted';
          const h = r.detail?.headline;
          const headline = h ? `${h.fetched} fetched · ${h.rejected} rejected · ${h.held} held · ${h.queued} queued` : '—';
          return `
            <tr>
              <td class="muted">${esc((r.started_at || '').replace('T', ' ').slice(0, 19))}</td>
              <td>${esc(r.trigger)}</td>
              <td>${fmtDuration(r.started_at, r.finished_at, r.status)}</td>
              <td>${headline}</td>
              <td><span class="${statusClass}">${esc(r.status)}</span></td>
              <td>
                ${r.detail ? `
                  <div class="sweep-toggle" onclick="toggleSweepDetail(${r.id})">per-source <span id="sarrow-${r.id}">▾</span></div>
                  <div id="sdetail-${r.id}" style="display:none">${renderSweepSourceDetail(r.detail)}</div>
                ` : `<span class="muted">in progress…</span>`}
              </td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

// detail.fetch is server-composed SourceResult[]; per-source error strings
// are third-party/network text and therefore untrusted — esc() every one,
// mirroring the failures table's snapshot rendering.
function renderSweepSourceDetail(detail) {
  const fetchLines = (detail.fetch || [])
    .map(s => `<div class="muted" style="padding-left:4px">${esc(s.source)}: ${s.fetched} fetched${s.upserted != null ? `, ${s.upserted} upserted` : ''}${s.error ? ` — error: ${esc(s.error)}` : ''}</div>`)
    .join('');
  const bc = detail.filter?.byCriterion || {};
  const criterionLine = `<div class="muted" style="padding-left:4px">rejected by criterion: location ${bc.location ?? 0} · title ${bc.title ?? 0} · yoe ${bc.yoe ?? 0} · stale ${bc.stale ?? 0} · llm ${bc.llm ?? 0}</div>`;
  const sidecarLine = detail.sidecar
    ? `<div class="muted" style="padding-left:4px">sidecar: ${detail.sidecar.ran ? 'ran' : 'did not run'}${detail.sidecar.error ? ` — error: ${esc(detail.sidecar.error)}` : ''}</div>`
    : '';
  return fetchLines + criterionLine + sidecarLine;
}

function toggleSweepDetail(id) {
  const body = document.getElementById(`sdetail-${id}`);
  const arrow = document.getElementById(`sarrow-${id}`);
  const expanded = body.style.display !== 'none';
  body.style.display = expanded ? 'none' : 'block';
  arrow.textContent = expanded ? '▾' : '▴';
}

load();
loadLibrary();
loadFailures();
loadQueue();
loadPostings();
loadSweeps();
</script>
</body>
