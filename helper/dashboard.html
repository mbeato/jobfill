// Settings tab — identity & EEO form (CFG-02, D-11). Renders exactly the
// five hand-authored profile.local.json sections (contact/links/workAuth/
// eeo/answers) as 27 labelled fields. The other five top-level profile
// keys are .tex-derived (generated from the resume build, not hand-
// authored) and MUST NEVER appear here — see 18-UI-SPEC.md "Surface 3" and
// helper/profile-merge.ts's PROFILE_SECTIONS, the authoritative field list
// this form mirrors name-for-name.
// -----------------------------------------------------------------------

async function loadIdentity() {
  const body = document.getElementById('settingsIdentityBody');
  body.innerHTML = `<div class="muted">loading profile…</div>`;
  try {
    const resp = await fetch('/profile');
    if (resp.status === 404) {
      renderIdentity({});
      body.insertAdjacentHTML('afterbegin', `<div class="settings-hint">no profile.local.json yet — fill in what you can below and save to create it. fields left blank stay blank until you fill them in.</div>`);
      return;
    }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const profile = await resp.json();
    renderIdentity(profile);
  } catch (e) {
    body.innerHTML = `<div class="muted">couldn't load your profile — ${esc(String(e?.message || e))}. check helper/profile.local.json directly if this keeps happening.</div>`;
  }
}

// Standard option sets for the fields that are standardised on real
// applications. These are US regulatory taxonomies, not preferences: race and
// the Hispanic/Latino question are the EEO-1 categories, `veteran` is the
// VEVRAA self-identification wording, and `disability` is OFCCP Form CC-305's
// wording. Employers must report against these sets, which is why
// Greenhouse/Lever/Ashby all present these exact options. Shipping them is the
// same "generic domain knowledge, not a personal value" case D-14 makes for the
// seniority term lists, so it stays CFG-05-compatible.
//
// `sexualOrientation` is NOT federally standardised; that list is the common
// ATS superset. `workAuth.status` deliberately mirrors the option wording in
// `extension/lib/prompt.js` so the value we store reads like the option the
// filler has to pick.
//
// Storing canonical wording also improves fill accuracy rather than
// constraining it: the filler matches these values to a form's options via the
// LLM (prompt.js "work-authorization questions that are a select … take the
// option matching workAuth.status" / "Demographic/EEO questions: answer from
// profile.eeo"), so the closer the stored string is to real option text, the
// less the model has to infer.
const DECLINE_SELF_ID = 'Decline to self-identify';
const IDENTITY_OPTIONS = {
  'workAuth.status': [
    'U.S. Citizen',
    'Permanent Resident (Green Card)',
    'H-1B',
    'F-1 OPT / STEM OPT',
    'TN',
    'L-1',
    'Other visa',
    'Require sponsorship',
  ],
  'eeo.gender': ['Male', 'Female', 'Non-binary', DECLINE_SELF_ID],
  'eeo.hispanicLatino': ['Yes', 'No', DECLINE_SELF_ID],
  // "Hispanic or Latino" belongs here as well as in its own question above:
  // EEO-1 has a two-question presentation (ethnicity, then race) and a
  // single-question one where Hispanic or Latino is simply one of the seven
  // categories. Greenhouse and friends use the single-question form, so a
  // real stored profile can legitimately hold it as `race`.
  'eeo.race': [
    'Hispanic or Latino',
    'American Indian or Alaska Native',
    'Asian',
    'Black or African American',
    'Native Hawaiian or Other Pacific Islander',
    'White',
    'Two or More Races',
    DECLINE_SELF_ID,
  ],
  // The VEVRAA and CC-305 options are full sentences (up to 71 chars). A native
  // <select> popup sizes to its widest option, so showing them verbatim blew the
  // dropdown out to screen width. Entries may therefore be `{ v, label }`: `v` is
  // the canonical string we store and hand the filler, `label` is the short text
  // shown in the menu. Never shorten `v` — the regulatory wording is the whole
  // point of these sets.
  'eeo.veteran': [
    { v: 'I am not a protected veteran', label: 'Not a protected veteran' },
    { v: 'I identify as one or more of the classifications of a protected veteran', label: 'I am a protected veteran' },
    { v: "I don't wish to answer", label: "Don't wish to answer" },
  ],
  'eeo.disability': [
    { v: 'Yes, I have a disability, or have had one in the past', label: 'Yes — have or have had a disability' },
    { v: 'No, I do not have a disability and have not had one in the past', label: 'No' },
    { v: 'I do not want to answer', label: "Don't want to answer" },
  ],
  'eeo.sexualOrientation': [
    'Heterosexual',
    'Gay',
    'Lesbian',
    'Bisexual',
    'Queer',
    'Pansexual',
    'Asexual',
    'Other',
    DECLINE_SELF_ID,
  ],
  'answers.willingToRelocate': ['Yes', 'No', 'Depends on the location'],
};

function renderIdentity(p) {
  const body = document.getElementById('settingsIdentityBody');
  const contact = p.contact || {};
  const links = p.links || {};
  const workAuth = p.workAuth || {};
  const eeo = p.eeo || {};
  const answers = p.answers || {};

  const textField = (id, label, value, type = 'text') => `
    <div class="settings-field">
      <label for="${id}">${label}</label>
      <input type="${type}" id="${id}" value="${esc(value ?? '')}">
    </div>`;
  const checkboxRow = (id, label, checked) => `
    <div class="settings-checkbox-row">
      <input type="checkbox" id="${id}" ${checked ? 'checked' : ''}>
      <label for="${id}" style="margin-bottom:0">${label}</label>
    </div>`;
  // A stored value that isn't in the canonical set is carried as an extra
  // selected option rather than dropped. Without this, a hand-edited
  // profile.local.json — or a set we later revise — would silently reset to
  // the first option the next time this form is saved, which is exactly the
  // kind of unrecoverable quiet data loss the profile merge exists to prevent.
  const selectField = (id, label, value, options, hint = '') => {
    const raw = (value ?? '').trim();
    // Entries are either a plain string (value doubles as the menu text) or
    // { v, label } where the stored value and the menu text differ.
    const norm = options.map((o) => (typeof o === 'string' ? { v: o, label: o } : o));
    // Match case-insensitively and select the canonical spelling. A profile
    // holding "yes" should snap to "Yes" rather than be carried as a one-off
    // variant — same meaning, and canonical casing is what the filler wants to
    // hand an ATS. Only a genuinely unrecognised value falls through to the
    // preserved-value branch below.
    const canonical = norm.find((o) => o.v.toLowerCase() === raw.toLowerCase());
    const current = canonical ? canonical.v : raw;
    const opts = [
      `<option value=""${current === '' ? ' selected' : ''}>— not set —</option>`,
      ...norm.map((o) => `<option value="${esc(o.v)}"${o.v === current ? ' selected' : ''}>${esc(o.label)}</option>`),
    ];
    if (current !== '' && !canonical) {
      opts.push(`<option value="${esc(current)}" selected>${esc(current)} — kept from your existing profile</option>`);
    }
    return `
    <div class="settings-field">
      <label for="${id}">${label}</label>
      <select id="${id}">${opts.join('')}</select>
      ${hint ? `<div class="settings-hint">${hint}</div>` : ''}
    </div>`;
  };

  body.innerHTML = `
    <div class="settings-subhead">contact</div>
    ${textField('id-contact-firstName', 'first name', contact.firstName)}
    ${textField('id-contact-lastName', 'last name', contact.lastName)}
    ${textField('id-contact-pronouns', 'pronouns', contact.pronouns)}
    ${textField('id-contact-email', 'email', contact.email, 'email')}
    ${textField('id-contact-phone', 'phone', contact.phone, 'tel')}
    ${textField('id-contact-city', 'city', contact.city)}
    ${textField('id-contact-state', 'state', contact.state)}
    ${textField('id-contact-country', 'country', contact.country)}
    ${textField('id-contact-location', 'location (as shown on applications)', contact.location)}

    <div class="settings-subhead">links</div>
    ${textField('id-links-linkedin', 'linkedin', links.linkedin, 'url')}
    ${textField('id-links-github', 'github', links.github, 'url')}
    ${textField('id-links-portfolio', 'portfolio', links.portfolio, 'url')}

    <div class="settings-subhead">work authorization</div>
    ${selectField('id-workAuth-status', 'status', workAuth.status, IDENTITY_OPTIONS['workAuth.status'],
      'used when a form asks for work authorization as a dropdown rather than yes/no.')}
    ${checkboxRow('id-workAuth-authorizedUS', 'authorized to work in the us', workAuth.authorizedUS)}
    ${checkboxRow('id-workAuth-needsSponsorship', 'needs sponsorship now', workAuth.needsSponsorship)}
    ${checkboxRow('id-workAuth-needsFutureSponsorship', 'will need sponsorship in the future', workAuth.needsFutureSponsorship)}
    ${checkboxRow('id-workAuth-over18', '18 or older', workAuth.over18)}

    <div class="settings-subhead">eeo (optional — used only where a form asks)</div>
    <div class="settings-hint" style="margin:-4px 0 12px">
      these are the standard us categories employers report against (eeo-1 for race,
      vevraa for veteran status, form cc-305 for disability), so the wording here matches
      what greenhouse, lever and ashby actually show. leave a field on
      <strong>— not set —</strong> to skip it: the filler then picks a
      &ldquo;decline&rdquo; option if the form offers one, and otherwise leaves the
      question alone.
    </div>
    ${selectField('id-eeo-gender', 'gender', eeo.gender, IDENTITY_OPTIONS['eeo.gender'])}
    ${selectField('id-eeo-hispanicLatino', 'are you hispanic or latino?', eeo.hispanicLatino, IDENTITY_OPTIONS['eeo.hispanicLatino'],
      'asked as its own question on most forms, separately from race.')}
    ${selectField('id-eeo-race', 'race', eeo.race, IDENTITY_OPTIONS['eeo.race'])}
    ${selectField('id-eeo-veteran', 'veteran status', eeo.veteran, IDENTITY_OPTIONS['eeo.veteran'])}
    ${selectField('id-eeo-disability', 'disability status', eeo.disability, IDENTITY_OPTIONS['eeo.disability'])}
    ${selectField('id-eeo-sexualOrientation', 'sexual orientation', eeo.sexualOrientation, IDENTITY_OPTIONS['eeo.sexualOrientation'],
      'not a federally standardised set — these are the options ats forms commonly offer.')}

    <div class="settings-subhead">canned answers</div>
    ${textField('id-answers-salaryExpectation', 'salary expectation', answers.salaryExpectation)}
    ${textField('id-answers-startDate', 'start date availability', answers.startDate)}
    ${selectField('id-answers-willingToRelocate', 'willing to relocate', answers.willingToRelocate, IDENTITY_OPTIONS['answers.willingToRelocate'])}
    ${textField('id-answers-howDidYouHear', 'how did you hear about us', answers.howDidYouHear)}

    <div class="settings-actions">
      <button id="identitySaveBtn" class="primary" onclick="saveIdentity()">save identity & eeo</button>
      <span class="settings-hint" id="identitySaveError"></span>
    </div>`;
}

// The single place the form is translated into the endpoint's shape: reads
// exactly five keys back from the DOM — never spreads a previously fetched
// profile object into the body, or the five .tex-derived top-level keys
// would ride along and defeat the point of the merge endpoint. Mirrors
// readCriteriaForm's role for the criteria editor above.
function readIdentityForm() {
  const val = (id) => document.getElementById(id).value;
  const checked = (id) => document.getElementById(id).checked;
  return {
    contact: {
      firstName: val('id-contact-firstName'),
      lastName: val('id-contact-lastName'),
      pronouns: val('id-contact-pronouns'),
      email: val('id-contact-email'),
      phone: val('id-contact-phone'),
      city: val('id-contact-city'),
      state: val('id-contact-state'),
      country: val('id-contact-country'),
      location: val('id-contact-location'),
    },
    links: {
      linkedin: val('id-links-linkedin'),
      github: val('id-links-github'),
      portfolio: val('id-links-portfolio'),
    },
    workAuth: {
      status: val('id-workAuth-status'),
      authorizedUS: checked('id-workAuth-authorizedUS'),
      needsSponsorship: checked('id-workAuth-needsSponsorship'),
      needsFutureSponsorship: checked('id-workAuth-needsFutureSponsorship'),
      over18: checked('id-workAuth-over18'),
    },
    eeo: {
      gender: val('id-eeo-gender'),
      race: val('id-eeo-race'),
      veteran: val('id-eeo-veteran'),
      disability: val('id-eeo-disability'),
      hispanicLatino: val('id-eeo-hispanicLatino'),
      sexualOrientation: val('id-eeo-sexualOrientation'),
    },
    answers: {
      salaryExpectation: val('id-answers-salaryExpectation'),
      startDate: val('id-answers-startDate'),
      willingToRelocate: val('id-answers-willingToRelocate'),
      howDidYouHear: val('id-answers-howDidYouHear'),
    },
  };
}

async function saveIdentity() {
  const body = readIdentityForm();
  try {
    const resp = await fetch('/profile', {
      method: 'PATCH',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const errorEl = document.getElementById('identitySaveError');
    if (!resp.ok) {
      const respBody = await resp.json().catch(() => ({}));
      if (errorEl) {
        errorEl.innerHTML = esc(`couldn't save — ${respBody.error || `HTTP ${resp.status}`}`);
        errorEl.classList.add('rule-error');
      }
      return;
    }
    if (errorEl) {
      errorEl.textContent = '';
      errorEl.classList.remove('rule-error');
    }
    await loadIdentity();
  } catch (e) {
    const errorEl = document.getElementById('identitySaveError');
    if (errorEl) {
      errorEl.innerHTML = esc(`couldn't save — ${String(e?.message || e)}`);
      errorEl.classList.add('rule-error');
    }
  }
}

// Tab navigation: one visible group at a time, persisted in the URL hash so a
// reload (or a bookmarked #runs) lands where the operator left off. All sections stay in
// the DOM and keep loading/rendering as before — tabs only control visibility.
const TABS = ['queue', 'runs', 'applications', 'library', 'failures', 'settings'];
function setTab(name) {
  if (!TABS.includes(name)) name = 'queue';
  for (const el of document.querySelectorAll('[data-tab]')) {
    el.classList.toggle('tab-visible', el.dataset.tab === name);
  }
  for (const b of document.querySelectorAll('[data-tabbtn]')) {
    b.classList.toggle('active', b.dataset.tabbtn === name);
  }
  if (location.hash !== `#${name}`) history.replaceState(null, '', `#${name}`);
}
setTab(location.hash.replace('#', '') || 'queue');

load();
loadLibrary();
loadFailures();
loadQueue();
loadPostings();
loadSweeps();
loadBatch();
loadSettings();
loadProfileText();
loadIdentity();

/* ── jf: shared JS primitives ──────────────────────────────────────────────
   Every ported surface (plans 02-09) consumes these directly. The existing
   esc() helper above (helper/dashboard.html:404) is reused as-is -- it is
   intentionally NOT redeclared here as a const, since that would throw over
   the live function binding and blank the page. armOrConfirm/armState above
   stay in place; queue and settings still depend on them until plans 02 and
   04. ──────────────────────────────────────────────────────────────────── */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

// Populated by each surface plan: key -> async (id, btn) => void. The
// delegated .jf-armable listener below looks a handler up here on the
// SECOND click (data-jf-action) and invokes it with (data-jf-id, btn).
const JF_ACTIONS = {};

// Populated by plan 09's syncStatusBar: dest -> () => ({ n, unit,
// filterLabel, filter, sort }). Inert until then.
const JF_STATUS = {};

/* statuses that mean "needs your attention" -- the ONE job of the accent.
   Per-surface vocabularies differ (queue statuses vs seek decisions vs
   application statuses), so verdictHtml takes them as an optional third arg. */
const ATTN = new Set(['failed', 'held']);
const DONE = new Set(['submitted', 'rejected']);

function verdictHtml(st, crit, vocab = { attn: ATTN, done: DONE }) {
  const cls = vocab.attn.has(st) ? ' jf-verdict--attn' : vocab.done.has(st) ? ' jf-verdict--muted' : '';
  return `<span class="jf-cell-decision"><span class="jf-verdict${cls}">${esc(st)}</span>` +
         `<span class="jf-crit" title="${esc(crit)}">${esc(crit)}</span></span>`;
}

/* ── disclosures (delegated: rows, panels, breakdowns) ───────────────────── */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.jf-disc');
  if (!btn) return;
  const target = document.getElementById(btn.getAttribute('aria-controls'));
  if (!target) return;
  const open = btn.getAttribute('aria-expanded') === 'true';
  btn.setAttribute('aria-expanded', String(!open));
  target.hidden = open;
});

/* ── two-click armed confirm ──────────────────────────────────────────────
   Native confirm() dies in the Playwright runner's browser, so destructive
   acts arm instead. Zero layout shift: the armed label is always SHORTER than
   the resting label and the width is pinned before the swap. The armed state
   signals by INVERTING ink, never by color: this system owns no red, and
   inversion survives both colour-blindness and forced-colors. A hairline
   thread under the label scrubs away over the 4s window so the revert is
   visible rather than surprising.
   Second-click dispatch (closes PATTERNS.md landmine #2): the reference's
   version only ever disarms on the second click and never fires a real
   action. Here, if the button carries data-jf-action, look it up in
   JF_ACTIONS and invoke it with (data-jf-id, btn) before disarming; a
   rejected/thrown handler still disarms so the button never gets stuck
   armed. If data-jf-action is absent, behave exactly like the reference
   (disarm only) -- keeps the primitive usable for a pure UI arm. ────────── */
const armTimers = new WeakMap();

function disarm(btn) {
  const t = armTimers.get(btn);
  if (t) { clearTimeout(t); armTimers.delete(btn); }
  btn.classList.remove('is-armed');
  btn.textContent = btn.dataset.resting;
  btn.style.minWidth = '';
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('.jf-armable');
  if (!btn) return;
  if (armTimers.has(btn)) {
    const action = btn.dataset.jfAction;
    const handler = action ? JF_ACTIONS[action] : null;
    if (handler) {
      Promise.resolve(handler(btn.dataset.jfId, btn))
        .catch((err) => console.error('jf-armable action failed', action, err))
        .finally(() => disarm(btn));
    } else {
      disarm(btn);
    }
    return;   // second click commits (or disarms if no action registered)
  }
  for (const other of $$('.jf-armable.is-armed')) disarm(other);
  btn.style.minWidth = `${btn.offsetWidth}px`;
  btn.textContent = btn.dataset.armed;
  btn.classList.add('is-armed');
  const thread = document.createElement('span');
  thread.className = 'jf-arm-thread';
  thread.setAttribute('aria-hidden', 'true');
  btn.appendChild(thread);
  armTimers.set(btn, setTimeout(() => disarm(btn), 4000));
});

// Plan 02: registers the criteria narrowing-save path for the delegated
// .jf-armable second-click dispatch above (JF_ACTIONS must exist first,
// hence this lives here rather than in the criteria section itself), and
// the settings status-bar fact for plan 09's syncStatusBar (inert until
// then).
JF_ACTIONS['settings.saveCriteria'] = () => saveCriteria();
JF_STATUS.settings = () => ({
  n: termCount(),
  unit: 'terms',
  filterLabel: 'across',
  filter: '4 rules',
  sort: 'unsaved edits are <b>not applied</b>',
});
</script>
</body>
